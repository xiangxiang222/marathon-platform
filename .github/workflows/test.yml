name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ut-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install and test
        run: |
          npm ci --prefix server
          npm test
      - name: Verify achievement model and shared canvas sources
        run: |
          node --test scripts/achievement-model.test.cjs
          node scripts/sync-achievement-poster.cjs --check
      - name: Check mini program package budget and image references
        run: node scripts/check-mini-package.cjs
      - name: Verify annual race archives in mini program
        run: node --test scripts/race-archives-mini.test.cjs
