<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#create" aria-label="赛历跑团设计稿首页"><span class="brand-mark"><svg viewBox="0 0 28 28"><path d="M5 21 13 7h10L14 21H5Zm5 0L18 7M6 16h12"/></svg></span><span class="brand-name">赛历<small>RUN TOGETHER</small></span></a>
    <div class="sidebar-label">一段完整的跑团旅程</div>
    <nav class="scenario-nav" aria-label="设计场景" id="scenario-nav"></nav>
    <div class="side-note"><b>人人都能发起一场同行</b>名称可以相同，身份清楚可辨。<br>创建、核验与纠纷，各有自己的入口。<br><br>DESIGN EXPLORATION · 2026.11</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><span>跑团</span><svg viewBox="0 0 20 20"><path d="m8 5 5 5-5 5"/></svg><b id="breadcrumb-title">创建跑团</b></div><div class="demo-label">交互设计稿 · 演示数据</div></header>
    <main class="page" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="sheet-mask" id="sheet-mask" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet" tabindex="-1"></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  const icon = (name) => {
    const paths = {
      arrow:'<path d="M4 10h12m-5-5 5 5-5 5"/>',back:'<path d="M16 10H4m5-5-5 5 5 5"/>',chevron:'<path d="m8 5 5 5-5 5"/>',check:'<path d="m5 10 3 3 7-7"/>',info:'<circle cx="10" cy="10" r="7"/><path d="M10 9v5m0-8v.2"/>',shield:'<path d="m10 2 6 3v5c0 4-6 7-6 7s-6-3-6-7V5l6-3Z"/><path d="m7 9 2 2 4-4"/>',pin:'<path d="M16 8c0 4-6 9-6 9S4 12 4 8a6 6 0 0 1 12 0Z"/><circle cx="10" cy="8" r="2"/>',people:'<circle cx="8" cy="6" r="3"/><path d="M2 17v-2a6 6 0 0 1 12 0v2M14 4a3 3 0 0 1 0 6m2 2a5 5 0 0 1 2 4"/>',calendar:'<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4m8-4v4M3 8h14m-10 4h2m3 0h1"/>',search:'<circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/>',lock:'<rect x="4" y="8" width="12" height="10" rx="2"/><path d="M6 8V6a4 4 0 0 1 8 0v2m-4 4v2"/>',flag:'<path d="M4 18V3m0 0c4-3 8 3 12 0v8c-4 3-8-3-12 0"/>',link:'<path d="m8 7 3-3a4 4 0 0 1 6 6l-3 3m-2 0-3 3a4 4 0 0 1-6-6l3-3m1 6 6-6"/>',plus:'<path d="M10 4v12M4 10h12"/>'
    };
    return '<svg viewBox="0 0 20 20" aria-hidden="true">'+(paths[name]||paths.arrow)+'</svg>';
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const badge = (button=false) => '<'+(button?'button type="button" data-action="verification-info" data-testid="verification-badge"':'span')+' class="verified'+(button?' button':'')+'">'+icon('shield')+'身份已核验</'+(button?'button':'span')+'>';
  const scenarios = [{key:'create',label:'创建跑团'},{key:'discover',label:'同名查找'},{key:'verify',label:'组织身份核验'},{key:'appeal',label:'名称与身份申诉'},{key:'admin',label:'处理工作台'}];
  const existing = [
    {id:10236,name:'西湖跑团',city:'杭州',district:'西湖区',leader:'阿哲',members:286,verified:true,place:'西湖 · 黄龙 · 浙大玉泉',intro:'沿着西湖跑，把城市的每一个清晨，跑成共同的回忆。每周二、四晚跑，周日长距离。',since:'2018 年',channel:'西湖跑团公开账号 · 已核对管理授权'},
    {id:10371,name:'西湖跑团',city:'绍兴',district:'柯桥区',leader:'阿峰',members:28,verified:false,place:'瓜渚湖 · 柯桥体育中心',intro:'住在同一片社区，喜欢同一件小事。跑快跑慢都欢迎，周末见。',since:'2025 年',channel:''}
  ];
  const state={screen:'create',name:'西湖跑团',city:'杭州',intro:'每周一起跑，慢慢变得更好。',created:null,current:existing[0],query:'西湖跑团',cityFilter:'全部',verifySource:'public',verifySubmitted:false,appealType:'impersonation',appealSubmitted:false,decision:null};
  let lastFocus=null,toastTimer;
  const main=document.getElementById('main');
  function notify(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},2800)}
  function footer(){return '<footer class="page-bottom"><span>设计验证原型 · 所有操作仅保存在当前页面内存</span><span>没有调用业务接口，没有上传真实资料</span></footer>'}
  function title(eyebrow,name,lead,no){return '<div class="title-row"><div><p class="eyebrow">'+eyebrow+'</p><h1>'+name+'</h1><p class="page-lead">'+lead+'</p></div><div class="title-aside"><strong>'+no+'</strong>RUN TOGETHER</div></div>'}
  function navigate(screen){state.screen=screen;render();window.scrollTo({top:0,behavior:'auto'});main.focus({preventScroll:true})}
  function updateNav(){document.getElementById('scenario-nav').innerHTML=scenarios.map((s,i)=>'<button type="button" class="nav-item '+((state.screen===s.key||(state.screen==='success'&&s.key==='create')||(state.screen==='public'&&s.key==='discover'))?'active':'')+'" data-screen="'+s.key+'" data-testid="nav-'+s.key+'"><span class="nav-no">0'+(i+1)+'</span>'+s.label+icon('chevron')+'</button>').join('');document.getElementById('breadcrumb-title').textContent=state.screen==='success'?'创建成功':state.screen==='public'?'跑团名片':scenarios.find(s=>s.key===state.screen)?.label||'创建跑团'}
  function matchCards(){const names=existing.filter(c=>c.name.replace(/\s/g,'').includes(state.name.trim().replace(/\s/g,''))&&state.name.trim());if(!names.length)return '<div class="hint">这个名字很适合新的开始。创建后即可邀请跑友。</div>';return '<div class="same-name" data-testid="same-name-notice"><div class="inline-title">'+icon('info')+'这里已有 '+names.length+' 个同名跑团</div><p class="same-copy">团名可以相同。请确认你要创建的是一个新的跑团，城市和团号会帮助大家分辨。</p>'+names.map(c=>'<div class="mini-match"><div class="letter">西</div><div class="match-copy"><div class="match-name">'+esc(c.name)+(c.verified?badge():'')+'</div><div class="meta">'+esc(c.city)+' · '+esc(c.district)+'　团号 #'+c.id+'</div></div><button type="button" class="text-btn" data-action="view-club" data-id="'+c.id+'">看看这个团 ›</button></div>').join('')+'</div>'}
  function createPage(){return title('A NEW BEGINNING','一起跑，从你开始。','谁都可以发起一个跑团，让同频的人在这里相遇。','01')+'<div class="create-layout"><section class="panel form-panel"><div class="panel-head"><h2>先认识一下你的跑团</h2><span class="step">不到一分钟</span></div><form id="create-form" data-testid="create-form"><label class="field"><span class="field-head"><span>跑团名称<span class="required">*</span></span><small>1–20 个字</small></span><input id="club-name" data-testid="club-name" name="name" maxlength="20" required value="'+esc(state.name)+'" placeholder="给跑友们的集合取个名字" autocomplete="off"></label><div id="same-name-matches">'+matchCards()+'</div><label class="field"><span class="field-head"><span>活动城市<span class="required">*</span></span><small>帮助跑友找到你</small></span><select id="club-city" data-testid="club-city" required><option value="">选择主要活动城市</option>'+['杭州','绍兴','上海','北京','成都','广州','其他城市'].map(c=>'<option '+(state.city===c?'selected':'')+' value="'+c+'">'+c+'</option>').join('')+'</select></label><label class="field"><span class="field-head"><span>一句话介绍</span><small>选填 · 80 字内</small></span><textarea id="club-intro" data-testid="club-intro" maxlength="80" placeholder="聊聊你们通常在哪里跑，欢迎什么样的跑友">'+esc(state.intro)+'</textarea></label><div class="form-end"><div class="agreement">'+icon('shield')+'<span>团名无需抢注。请使用真实介绍，不冒充其他组织或个人。</span></div><button class="primary full" type="submit" data-testid="create-submit">创建跑团'+icon('arrow')+'</button><p class="hint">创建后即可邀请跑友，入团申请仍由你审核。</p></div></form></section><aside class="preview-column"><div class="preview-label"><span>你的跑团名片</span><span>实时预览</span></div><div class="identity-card"><div class="track"></div><div class="card-kicker">A PLACE TO RUN TOGETHER</div><div class="letter" id="preview-letter">西</div><div class="identity-name" id="preview-name">'+esc(state.name)+'</div><div class="identity-location">'+icon('pin')+'<span id="preview-city">'+esc(state.city||'活动城市')+'</span> · 一起跑，更远一点</div><p class="identity-desc" id="preview-intro">'+esc(state.intro||'新的故事，从第一次集合开始。')+'</p><div class="card-footer"><div>公开负责人<b>小林</b></div><div>团号<b>创建后生成</b></div></div></div><p class="identity-footnote">稳定团号代表唯一的这个团，名字不需要独占。</p><div class="quiet-note"><b>一个小团，也是一种很好的开始</b>创建后可立即管理活动与成员。<br>刚创建的跑团不自动进入推荐；<br>你和跑友仍可通过完整团名、团号或邀请找到它。</div></aside></div>'+footer()}
  function successPage(){const c=state.created||newClub();return title('YOUR CREW IS READY','跑团有了，等你们开跑。','先约上熟悉的跑友，下一次集合就有了着落。','01')+'<section class="panel success-banner" data-testid="creation-success"><div class="success-icon">'+icon('check')+'</div><h2>'+esc(c.name)+'，创建成功</h2><p>'+esc(c.city)+' · 负责人小林<br>这是属于你们的新跑团。名称相同，也各有各的故事。</p><div class="public-id">唯一团号 #'+c.id+' · 邀请与记录始终跟随这个团</div></section><div class="next-steps"><section class="panel next-card">'+icon('people')+'<h3>把第一位跑友请进来</h3><p>发一张跑团名片到群里。朋友可以先看介绍，再申请加入。</p><button class="primary" data-action="invite" data-testid="invite-first">生成邀请名片'+icon('arrow')+'</button></section><section class="panel next-card">'+icon('calendar')+'<h3>约好第一次碰面</h3><p>时间、地点、距离，简单说明就好。一起迈出第一步。</p><button class="secondary" data-action="first-activity" data-testid="first-activity">发起第一次约跑'+icon('arrow')+'</button></section></div><section class="panel later-row">'+icon('shield')+'<div><strong>你们已经是一个线下跑团？</strong><p>可选的组织身份核验，让老朋友更容易认出你。</p></div><button class="subtle-link" data-screen="verify">了解身份核验'+icon('chevron')+'</button></section><p class="info-line">'+icon('info')+'<span>你已经可以使用跑团。新团暂不自动进入推荐，完整团名搜索、团号和邀请均可立即到达。</span></p><button class="subtle-link" data-action="view-created">预览跑团名片'+icon('arrow')+'</button>'+footer()}
  function newClub(){return{id:10482,name:state.name.trim()||'西湖跑团',city:state.city||'杭州',district:'新朋友的集合地',leader:'小林',members:1,verified:false,place:'常跑地点待补充',intro:state.intro.trim()||'新的故事，从第一次集合开始。',since:'今天',channel:''}}
  function resultCard(c){return '<article class="panel result-card" data-testid="club-result-'+c.id+'"><div class="letter '+(c.verified?'rose':'')+'">'+esc(c.name.slice(0,1))+'</div><div class="result-copy"><h3 class="result-name">'+esc(c.name)+(c.verified?badge():'')+'</h3><div class="result-detail"><span>'+icon('pin')+esc(c.city)+' · '+esc(c.district)+'</span><span>公开负责人 '+esc(c.leader)+'</span></div><div class="result-footer"><span>团号 #'+c.id+'</span><span>'+c.members+' 位跑友</span><span>'+esc(c.place)+'</span></div></div><button class="result-action" data-action="view-club" data-id="'+c.id+'" data-testid="view-club-'+c.id+'">查看这个跑团 ›</button></article>'}
  function filteredClubs(){const q=state.query.trim().toLowerCase();return [...existing,...(state.created?[state.created]:[])].filter(c=>(!q||c.name.toLowerCase().includes(q)||String(c.id)===q.replace('#',''))&&(state.cityFilter==='全部'||c.city===state.cityFilter))}
  function resultList(){const clubs=filteredClubs();return '<div class="search-heading"><span>名字相同也没关系，城市、负责人和团号都能帮助你确认。</span><span>'+clubs.length+' 个结果</span></div><div class="results">'+(clubs.map(resultCard).join('')||'<div class="panel empty-state"><h3>还没有找到这个跑团</h3><p>试试完整团名、团号，或请朋友分享跑团名片。</p><button class="secondary" data-screen="create">我来发起一个跑团</button></div>')+'</div>'}

  function verifyPage(){return title('A CLEARER IDENTITY','让熟悉你的人，一眼认出。','组织身份核验是可选项。你的跑团已经可以正常使用。','03')+'<div class="dual-layout"><section class="panel form-panel"><div class="panel-head"><h2>核对组织管理关系</h2><span class="step">约 3 分钟准备</span></div>'+(state.verifySubmitted?'<section class="status-box" data-testid="verify-status"><h3>'+ (state.verifySource==='public'?'申请已提交，等待核对':'已保存，需要补充可核对来源')+'</h3><p>'+(state.verifySource==='public'?'我们会核对公开渠道与本账号的管理授权关系。核验期间，跑团、邀请和活动都可继续使用。':'截图可以作为辅助材料，但无法单独证明管理授权。补充公开渠道或可回访的组织联系人后，再继续核对。')+'</p><div class="status-steps"><span>提交说明</span><span class="current">'+(state.verifySource==='public'?'待核对':'待补证')+'</span><span>结果通知</span></div><button class="subtle-link" data-action="reset-verification">修改演示申请 ›</button></section>':'<form id="verify-form" data-testid="verify-form"><label class="field"><span class="field-head">申请核验的组织</span><input value="'+esc(state.created?.name||'西湖跑团')+'" aria-label="申请核验的组织" required maxlength="40"></label><label class="field"><span class="field-head">你与组织的关系</span><select aria-label="你与组织的关系"><option>组织负责人</option><option>获得授权的运营人员</option></select></label><div class="field"><span class="field-head">用什么方式核对？</span><div class="choice-stack"><label class="radio-card"><input type="radio" name="verifySource" value="public" '+(state.verifySource==='public'?'checked':'')+'><strong>有可核对的公开渠道</strong><p>例如组织公开账号发布的授权说明，或该渠道的管理者配合确认。</p></label><label class="radio-card"><input type="radio" name="verifySource" value="screenshot" '+(state.verifySource==='screenshot'?'checked':'')+'><strong>目前只有截图或聊天记录</strong><p>可以先保存说明，后续需要补充可核对来源。</p></label></div></div><div id="verification-source-fields">'+verificationFields()+'</div><div class="soft-box neutral-box">'+icon('lock')+'<strong>仅授权核验人员可见</strong>提交说明不会出现在公开名片上，本原型不会上传或保存真实资料。</div><div class="form-end"><button type="submit" class="primary full" data-testid="verify-submit">提交核验说明'+icon('arrow')+'</button><p class="hint">本设计稿仅模拟结果，不执行真实核验。</p></div></form>')+'</section><aside class="panel aside-card"><h3>核验会带来什么？</h3><p>'+badge()+'</p><p>在搜索与名片上显示身份标记，帮助跑友辨认组织与管理者。</p><div class="aside-rule"><b>只核对管理授权关系</b><span>不会授予团名独占权。</span><span>不会把其他同名跑团判作冒用。</span><span>不会为活动安全或商业服务背书。</span><span>没有核验标记，跑团功能仍可正常使用。</span></div><div class="aside-rule"><b>组织与管理员可以变更</b><p>管理权转交后需重新核对授权，历史记录保持连续。</p></div></aside></div>'+footer()}

  function appealPage(){return title('KEEP THE COMMUNITY CLEAR','守护真实的组织关系。','同名可以共存；冒充身份、误导跑友的行为，需要认真处理。','04')+'<div class="dual-layout"><section class="panel form-panel"><div class="panel-head"><h2>说明你遇到的情况</h2><span class="step">先区分，再处理</span></div>'+(state.appealSubmitted?'<section class="status-box" data-testid="appeal-status"><h3>'+ (state.appealType==='same-name'?'同名说明已记录，无违规工单':'申诉已提交，双方都有说明机会')+'</h3><p>'+(state.appealType==='same-name'?'名称相同本身不构成冒用，不会因此处罚或移交跑团。建议补充城市、常跑地点和组织身份，让跑友更容易辨认。':'我们将核对可验证事实，并通知相关管理者补充说明。处理以停止误导为目的，不会移交成员、活动或个人资料。')+'</p><button class="subtle-link" data-action="reset-appeal">返回修改说明 ›</button>'+(state.appealType==='impersonation'?'<button class="secondary full" data-screen="admin" style="margin-top:12px">查看处理工作台演示</button>':'')+'</section>':'<form id="appeal-form" data-testid="appeal-form"><div class="choice-stack"><label class="radio-card"><input type="radio" name="appealType" value="impersonation" '+(state.appealType==='impersonation'?'checked':'')+'><strong>有人冒用我们的组织身份</strong><p>例如声称自己是我们的管理员，复制标识、官方介绍或招募入口，使跑友误认。</p></label><label class="radio-card"><input type="radio" name="appealType" value="same-name" '+(state.appealType==='same-name'?'checked':'')+'><strong>只是名字相同，想区分一下</strong><p>尚未发现对方声称与你们是同一个组织。</p></label></div><div id="appeal-fields">'+appealFields()+'</div><div class="form-end"><button type="submit" class="primary full" data-testid="appeal-submit">'+(state.appealType==='same-name'?'记录区分建议':'提交冒用申诉')+icon('arrow')+'</button><p class="hint">演示流程，不会对真实跑团发起举报。</p></div></form>')+'</section><aside class="panel aside-card"><h3>怎样算身份混淆？</h3><p>“我们也叫西湖跑团”可以是一种正常同名。</p><p>“我们就是杭州原来的西湖跑团，原团长已授权”则涉及需要核实的组织关系。</p><div class="aside-rule"><b>判断依据是事实</b><span>不是谁先注册，谁就拥有名字。</span><span>不是人数更多，就能拿走对方跑团。</span><span>不是收到举报，就立即判定违规。</span></div><div class="aside-rule"><b>信息各有边界</b><p>你提供的联系信息和私密材料，不会公开给普通成员，也不会原样交给另一方。</p></div></aside></div>'+footer()}
  function appealFields(){return state.appealType==='same-name'?'<div class="soft-box neutral-box" data-testid="same-name-safe"><strong>正常同名，不直接处罚</strong>平台会帮助双方展示城市、负责人、团号等识别信息。若后续发现具体的冒用行为，可以补充事实发起申诉。</div><label class="field"><span class="field-head">你希望怎样帮助跑友区分？</span><textarea aria-label="区分建议">演示：希望名片能清楚显示杭州西湖与绍兴柯桥，不要让新跑友加错。</textarea></label>':'<label class="field"><span class="field-head">涉及的跑团号<span class="required">*</span></span><input data-testid="reported-club-id" aria-label="涉及的跑团号" value="#10482" required></label><label class="field"><span class="field-head">具体冒用行为与可核对来源<span class="required">*</span></span><textarea aria-label="具体冒用行为与可核对来源" required>演示：该团简介声称“杭州西湖跑团原班管理”，但组织公开渠道没有发布此授权。请核对其管理关系。</textarea></label><label class="field"><span class="field-head">你与组织的关系</span><input aria-label="你与组织的关系" value="演示：已授权组织运营"></label><div class="soft-box neutral-box"><strong>只提交与你的申诉相关的信息</strong>正式流程中可提供公开渠道与授权说明。此处仅作交互演示，不接收证件、联系方式或真实文件。</div>'}
  const decisions={supplement:{title:'已请求双方补充说明',copy:'请申诉方提供可核对的组织渠道；请被申诉方解释“原班管理”的依据。等待期间不判定冒用，7 日为示例答复时限。'},reduce:{title:'已暂时减少混淆页面曝光',copy:'演示：因已发现具体误导描述，临时停止该页面进入公开推荐，并标记待核对。已有成员、活动和团内记录照常保留；完整团号与原邀请仍可定位。措施需定期复查，不等于认定违规。'},rename:{title:'已要求调整名称或身份描述',copy:'演示：核对后确认没有所称组织授权。要求移除“原班管理”等误导描述；必要时采用不会造成混淆的名称。团号、成员、活动、跑量和私密资料不移交给申诉方。'},dismiss:{title:'申诉未成立，保留合理同名',copy:'演示：双方属于独立组织，仅有同名，没有可证实的冒充。关闭冒用工单，保留双方跑团，展示城市与团号供跑友分辨；新证据可再次提交。'}};
  function adminPage(){return title('TRUST & COMMUNITY','把事实看清，把边界守住。','处理身份冒用，不分配名称所有权。每一步都有记录与申辩入口。','05')+'<section class="case-bar"><div><strong>名称与身份申诉 · CASE-2026-018</strong><p>演示案件　2026.11.01 09:20 创建　·　待核对双方管理关系</p></div><span class="status-tag">'+(state.decision?'已有处理记录':'待补充事实')+'</span></section><div class="case-grid"><section class="panel evidence-card"><div class="case-label">申诉方 · 公开信息</div><h3>西湖跑团 '+badge()+'</h3><p class="case-id">杭州 · 西湖区　团号 #10236</p><dl><div class="evidence-line"><dt>公开负责人</dt><dd>阿哲</dd></div><div class="evidence-line"><dt>主张内容</dt><dd>对方声称为本组织原班管理，造成身份混淆。</dd></div><div class="evidence-line"><dt>公开渠道</dt><dd>组织公开账号的管理授权说明，已做历史留档。</dd></div></dl><details class="private-box"><summary>'+icon('lock')+'私密辅助材料 · 仅案件处理人</summary><p>演示：申请人管理授权确认及回访记录。真实附件不在此原型中，不对被申诉方展示身份文件和联系人信息。</p></details></section><section class="panel evidence-card"><div class="case-label">被申诉方 · 公开信息</div><h3>西湖跑团</h3><p class="case-id">杭州 · 西湖区　团号 #10482</p><dl><div class="evidence-line"><dt>公开负责人</dt><dd>小林</dd></div><div class="evidence-line"><dt>争议表述</dt><dd>“杭州西湖跑团原班管理，欢迎原团友加入。”</dd></div><div class="evidence-line"><dt>当前说明</dt><dd>尚未提供组织授权；已通知管理者补充解释。</dd></div></dl><details class="private-box"><summary>'+icon('lock')+'申辩材料 · 仅案件处理人</summary><p>演示：管理者可补充独立组织说明或真实授权来源。所有私密材料与公开页面信息分开保存。</p></details><div class="soft-box"><strong>这是一条虚构的争议案例</strong>仅为展示处理流程，不代表创建示例中的小林有此行为。</div></section></div><section class="panel decision-panel"><h3>选择与事实相称的下一步</h3><p class="hint">这些操作是处理结果的演示。正式操作必须说明事实、范围、时限，并通知双方和提供申辩入口。</p><div class="decision-options">'+[['supplement','请求补证','双方都有说明与补充材料的机会'],['reduce','临时减少曝光','针对具体误导风险，可复查、可恢复'],['rename','要求调整名称或描述','确认冒用后停止混淆，保留团内记录'],['dismiss','驳回冒用申诉','仅有正常同名，保留独立使用']].map(([key,name,desc])=>'<button class="decision-btn '+(state.decision===key?'selected':'')+'" data-decision="'+key+'" data-testid="decision-'+key+'"><strong>'+name+'</strong><small>'+desc+'</small></button>').join('')+'</div>'+(state.decision?'<div class="decision-result" data-testid="decision-result"><strong>'+decisions[state.decision].title+'</strong><br>'+decisions[state.decision].copy+'</div>':'')+'<div class="soft-box neutral-box"><strong>不提供“接管对方跑团”操作</strong>无论处理结果如何，不把对方的成员、活动、个人运动或私密资料移交给申诉方。被申诉方可申请复核，双方可获知处理依据与下一步。</div></section><div class="timeline"><span><b>09:20</b>收到申诉，保留争议页面快照</span><span><b>09:35</b>通知双方补充可核对的组织关系</span>'+(state.decision?'<span><b>当前</b>'+decisions[state.decision].title+'（演示）</span>':'')+'</div>'+footer()}

  function openSheet(title,content){lastFocus=document.activeElement;const mask=document.getElementById('sheet-mask');document.getElementById('sheet').innerHTML='<div class="sheet-head"><h2 id="sheet-title">'+title+'</h2><button class="close-btn" data-action="close-sheet" aria-label="关闭">×</button></div>'+content;mask.hidden=false;document.body.style.overflow='hidden';document.getElementById('sheet').focus()}

    if(action==='simulate-invite'){notify('演示邀请已生成 · 不发送真实消息');return}
    if(action==='first-activity'){openSheet('第一次集合，从简单开始。','<form id="activity-form"><label class="field"><span class="field-head">约跑主题</span><input value="第一次一起跑" required maxlength="30"></label><label class="field"><span class="field-head">集合地点</span><input value="演示：西湖边的老地方" required maxlength="50"></label><label class="field"><span class="field-head">和跑友说一句</span><textarea maxlength="80">跑快跑慢都欢迎，我们一起出发。</textarea></label><button class="primary full" type="submit">生成约跑预览'+icon('arrow')+'</button><p class="hint">仅演示发布引导，不创建真实活动。</p></form>');return}
    if(action==='join'){openSheet('加入之前，确认一下。','<div class="soft-box neutral-box"><strong>'+esc(state.current.name)+' · #'+state.current.id+'</strong>'+esc(state.current.city)+' · '+esc(state.current.district)+'<br>公开负责人：'+esc(state.current.leader)+'</div><p>你提交的是这个团号的入团申请。申请通过后，才能查看团内活动、成员与训练信息。</p><button class="primary full" data-action="simulate-join">提交演示申请</button>');return}
    if(action==='simulate-join'){closeSheet();notify('演示申请已提交 · 等待团长确认');return}
    if(action==='reset-verification'){state.verifySubmitted=false;render();return}
    if(action==='reset-appeal'){state.appealSubmitted=false;render();return}
  });
  document.addEventListener('input',event=>{
    const id=event.target.id;
    if(id==='club-name'){state.name=event.target.value;document.getElementById('preview-name').textContent=state.name||'你的跑团名称';document.getElementById('preview-letter').textContent=state.name.slice(0,1)||'团';document.getElementById('same-name-matches').innerHTML=matchCards()}
    if(id==='club-intro'){state.intro=event.target.value;document.getElementById('preview-intro').textContent=state.intro||'新的故事，从第一次集合开始。'}
    if(id==='club-search'){state.query=event.target.value;document.getElementById('search-results').innerHTML=resultList()}
  });
  document.addEventListener('change',event=>{
    if(event.target.id==='club-city'){state.city=event.target.value;document.getElementById('preview-city').textContent=state.city||'活动城市'}
    if(event.target.name==='verifySource'){state.verifySource=event.target.value;document.getElementById('verification-source-fields').innerHTML=verificationFields()}
    if(event.target.name==='appealType'){state.appealType=event.target.value;document.getElementById('appeal-fields').innerHTML=appealFields();document.querySelector('[data-testid="appeal-submit"]').innerHTML=(state.appealType==='same-name'?'记录区分建议':'提交冒用申诉')+icon('arrow')}
  });
  document.addEventListener('submit',event=>{
    event.preventDefault();if(!event.target.reportValidity())return;
    if(event.target.id==='create-form'){if(!state.name.trim()||!state.city){notify('请填写团名并选择活动城市');return}state.created=newClub();state.current=state.created;navigate('success')}
    if(event.target.id==='verify-form'){state.verifySubmitted=true;render()}
    if(event.target.id==='appeal-form'){state.appealSubmitted=true;render()}
    if(event.target.id==='activity-form'){closeSheet();notify('第一次约跑预览已生成 · 未创建真实活动')}
  });
  document.getElementById('sheet-mask').addEventListener('click',event=>{if(event.target.id==='sheet-mask')closeSheet()});
  document.addEventListener('keydown',event=>{
    const mask=document.getElementById('sheet-mask');if(mask.hidden)return;if(event.key==='Escape'){closeSheet();return}
    if(event.key==='Tab'){const items=Array.from(document.getElementById('sheet').querySelectorAll('button,input,select,textarea,a[href]')).filter(el=>!el.disabled);const first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement.id==='sheet')){event.preventDefault();last?.focus()}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement.id==='sheet')){event.preventDefault();first?.focus()}}
  });
  window.addEventListener('hashchange',()=>{if(scenarios.some(s=>s.key===location.hash.slice(1)))navigate(location.hash.slice(1))});
  if(scenarios.some(s=>s.key===location.hash.slice(1)))state.screen=location.hash.slice(1);
  render();
})();
</script>
</body>
</html>
