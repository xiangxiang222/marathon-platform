<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#ff1838}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #ff1838;
  --brand-soft: #fff0f2;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --brand-header: linear-gradient(145deg, #ff1838 0%, #ff2946 60%, #ff4659 100%);
  --text: #1a1a1a;
  --text-secondary: #777777;
  --border: #eeeeee;
  --sky: #555555;
  --sky-soft: #f7f7f7;
  --mint: #555555;
  --mint-soft: #f7f7f7;
  --lilac: #555555;
  --lilac-soft: #f7f7f7;
  --sun: #555555;
  --sun-soft: #f7f7f7;
  --peach-soft: #fff0f2;
  --card-shadow: none;
  --action-fill: #ff1838;
  --control-radius: 10.4px;
  --card-radius: 12.48px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: var(--page-bg);
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: normal; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: var(--page-bg); font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 6.24px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: var(--page-bg); }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 12px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky, .surface-mint, .surface-lilac, .surface-sun, .surface-peach { background: var(--surface); border-color: var(--border); }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { position: relative; padding-bottom: 20.8px; background: var(--brand-header); color: #fff; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { flex: 1; min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: normal; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 16.64px 12.48px; color: #ffffffcf; font-size: 12px; line-height: 1.5; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.header-actions { display: flex; flex: none; align-items: center; justify-content: flex-end; }

.header-actions { position: relative; color: #fff; }

.club-detail { min-height: 100vh; box-sizing: border-box; padding: 12.48px 12.48px calc(33.28px + env(safe-area-inset-bottom)); }
.club-detail .card { box-sizing: border-box; margin-bottom: 12.48px; padding: 16.64px; border: 0.52px solid #ebebed; border-radius: 12.48px; }
.club-detail .detail-hero { padding: 16.64px; background: var(--surface); }
.club-detail .detail-hero .h2 { margin: 7.28px 0 10.4px; font-size: 22px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.club-detail .detail-kicker { color: var(--brand); font-size: 12px; font-weight: 600; letter-spacing: normal; }
.club-detail .h2 { font-size: 16px; font-weight: 600; line-height: 1.4; }
.club-detail .src { color: #737373; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.club-detail .sum { margin-top: 14.56px; padding: 10.4px 12.48px; border-radius: 9.36px; background: #f7f7f8; color: #595959; font-size: 12px; line-height: 1.6; }
.club-detail button.btn, .club-detail button.ghost, .club-detail .fold-toggle { display: flex; align-items: center; justify-content: center; min-height:44px; height: auto; box-sizing: border-box; padding: 10.4px 12.48px; line-height: 1.35; font-size: 14px; text-align: center; }
.club-detail button.btn { margin-top: 12.48px; border-radius:12.48px; }
.club-detail button.ghost { margin: 8.32px 0 0; border: 0.52px solid #ebebed; border-radius:12.48px; background: #f7f7f8; color: #595959; font-size: 12px; }
.club-detail button.ghost.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.club-detail button[disabled] { color: #737373; background: #f2f2f2; }
.club-detail .fold-toggle { justify-content: space-between; width: 100%; min-height:44px; margin: 9.36px 0 0; padding: 8.32px 0; border-radius: 0; background: transparent; color: #737373; border: 0; font-size: 14px; text-align: left; }
.club-detail .fold-toggle span:last-child { color: #737373; font-size: 18px; }
.club-detail .management-card > .fold-toggle { margin-top: 0; color: var(--text); font-size: 16px; font-weight: 600; }
.club-detail .share-copy { max-height: 270.4px; margin-top: 6.24px; padding: 12.48px; overflow-y: auto; border-radius: 9.36px; background: #f7f7f8; color: #737373; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.club-detail .row { align-items: center; padding: 12.48px 0; font-size: 12px; }
.club-detail .row span { min-width: 0; overflow-wrap: anywhere; }
.club-detail .row span:last-child { flex-shrink: 0; max-width: 48%; text-align: right; font-variant-numeric: tabular-nums; }
.club-detail input { height: 45.76px; border: 0.52px solid #ebebed; background: #f7f7f8; font-size: 14px; }
.club-detail .detail-actions { display: flex; flex-wrap: wrap; gap: 8.32px; margin-top: 12.48px; }
.club-detail .detail-actions button.ghost { flex: 1; margin-top: 0; }

.club-detail .detail-options { display: flex; flex-wrap: wrap; gap: 6.24px; margin-top: 10.4px; }
.club-detail .detail-options button.ghost { flex: 1 1 42%; min-width: 0; margin: 0; }
.club-detail .detail-select { display: flex; align-items: center; justify-content: space-between; min-height:44px; margin-top: 10.4px; padding: 0 12.48px; border: 0.52px solid #ebebed; border-radius: 9.36px; background: #f7f7f8; color: #595959; font-size: 12px; }

.src { color: var(--text-secondary); font-size: 12px; margin-top: 4.16px; }
.title { font-size: 24px; font-weight: 600; }
.album.grid { flex-wrap: wrap; }
.album.fall .shot { margin-top: 8.32px;  }
.shot img, .shot video { width: 100%;  }
.album.grid .shot img, .album.grid .shot video { height: 104px;  }
.album.fall .shot img, .album.fall .shot video { height: 187.2px;  }
.drop { color: var(--brand); margin-right: 8.32px; }
.detail-state { margin: 16.64px; padding: 20.8px 14.56px;  background: var(--surface); text-align: center; }
.state-title { color: var(--text); font-size: 18px; font-weight: 600; }
.detail-state .src { margin-top: 8.32px; overflow-wrap: anywhere;  }
.detail-state .btn { margin-top: 14.56px;  }

.club-detail .title { margin: 8.32px 0; overflow-wrap: anywhere; }
.club-detail .drop { display: inline-flex; align-items: center; min-height:44px; font-size: 12px; }
.club-detail .shot .src { font-size: 12px;  }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-album-album .card, .mini-album-album .detail-state, .mini-album-album .shot { border-radius: 12.48px; }
.mini-album-album .btn, .mini-album-album .ghost { border-radius: 12.48px; }
.mini-album-album { color: var(--text); }
.mini-album-album button { font-weight: 500; border-radius: 12.48px; }

.club-detail .card { border: 1px solid var(--border); }
.club-detail .title { font-size: 24px; font-weight: 600; line-height: 1.45; }
.detail-options { border-bottom: 1px solid var(--border); gap: 14.56px; }
.detail-options .ghost { position: relative; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text-secondary); font-size: 14px; }
.detail-options .ghost.on { color: var(--text); background: transparent; box-shadow: none; }
.album.grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10.4px; margin-top: 10.4px; }
.album.grid .shot { width: auto; margin: 0; }
.shot { overflow: hidden; border: 1px solid var(--border); border-radius: 12.48px; }
.shot img,.shot video { border-radius: 0; }
.shot .src,.shot .drop { padding: 0 6.24px; }
.album.grid .shot img,.album.grid .shot video { height: 124.8px; }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-album-album .btn { font-size: 14px; font-weight: 500; }
.mini-album-album .ghost { font-size: 13px; font-weight: 500; }

/* Color surfaces use existing semantic body elements; layout stays unchanged. */
.mini-album-album > .card:first-child { background: var(--surface); box-shadow: none; }

</style></head><body><div class="pad club-detail mini-album-album">
  <div class="card">
    <div class="detail-kicker">留住一起奔跑的瞬间</div><div class="title">周三西湖夜跑 · 稳稳向前</div>
    <div class="src">11月11日 周三 西湖柳浪闻莺</div>
    <div class="src">0 张照片 · 0 个视频</div>
    <div class="detail-options"><button class="ghost on">照片 0</button><button class="ghost ">视频 0</button></div>
    <div class="detail-actions">
    <button class="ghost">瀑布流</button>
    <button class="ghost">审核关闭</button></div>
    
    <div class="src">还没有照片。团员可以上传。</div>
    
    <div class="album grid">
    
    </div>
    <button class="btn">上传照片或视频</button>
    <div class="src">照片不超过 8MB，视频不超过 40MB。还剩 400 张照片、20 个视频。</div>
  </div>
  
</div>

</body></html>
