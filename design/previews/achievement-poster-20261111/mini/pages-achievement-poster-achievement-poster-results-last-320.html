  --brand: #e1251b;

  --sky: #2767aa;
  --sky-soft: #eaf4ff;
  --mint: #23765f;
  --mint-soft: #e9f7f2;
  --lilac: #7753ae;
  --lilac-soft: #f2edff;
  --sun: #986614;
  --sun-soft: #fff4d7;
  --peach-soft: #fff0e7;
  --card-shadow: 0 1.7066666666666668px 10.24px rgba(42, 61, 105, .025);
  --action-fill: linear-gradient(120deg, #e1251b, #cf3025);
  --control-radius: 10.24px;
  --card-radius: 15.36px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.4266666666666667px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.4266666666666667px solid var(--border);
  border-radius: 8.533333333333333px;
  background: #f8faff;
  color: var(--text);
  font-size: 14px;

}

.pad { padding: 13.653333333333334px 13.653333333333334px calc(20.48px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.24px;
  padding: 13.653333333333334px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.128px; }

.slot-state { color: var(--text-secondary); font-size: 12px; }

.field { display: flex; align-items: center; gap: 6.826666666666667px; }

  line-height: 1.4;

}
.login-go { margin-top: 10.24px; }
button.ghost {
  min-height: 44px;
  margin: 6.826666666666667px 6.826666666666667px 0 0;
  padding: 10px 16px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);

  color: var(--text);

  font-weight: 500;

}
button.ghost.on { border-color: #f4bdb8; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 3.4133333333333336px; padding: 1.7066666666666668px 5.12px; border: 0.4266666666666667px solid #ebebed; border-radius: 5.12px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 8.533333333333333px; margin-top: 6.826666666666667px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 5.12px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 8.533333333333333px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 10.24px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 5.12px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky { background: linear-gradient(135deg, #f8fcff, var(--sky-soft)); border-color: #d9e9fb; }
.surface-mint { background: linear-gradient(135deg, #fbfffd, var(--mint-soft)); border-color: #d5eee4; }
.surface-lilac { background: linear-gradient(135deg, #fdfbff, var(--lilac-soft)); border-color: #e4d9f7; }
.surface-sun { background: linear-gradient(135deg, #fffdf7, var(--sun-soft)); border-color: #f3e4b8; }
.surface-peach { background: linear-gradient(135deg, #fffaf7, var(--peach-soft)); border-color: #f6dcd0; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }
