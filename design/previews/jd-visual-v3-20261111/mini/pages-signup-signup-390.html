<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#ff1838}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #ff1838;
  --brand-soft: #fff0f2;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --brand-header: linear-gradient(145deg, #ff1838 0%, #ff2946 60%, #ff4659 100%);
  --text: #1a1a1a;
  --text-secondary: #777777;
  --border: #eeeeee;
  --sky: #555555;
  --sky-soft: #f7f7f7;
  --mint: #555555;
  --mint-soft: #f7f7f7;
  --lilac: #555555;
  --lilac-soft: #f7f7f7;
  --sun: #555555;
  --sun-soft: #f7f7f7;
  --peach-soft: #fff0f2;
  --card-shadow: none;
  --action-fill: #ff1838;
  --control-radius: 10.4px;
  --card-radius: 12.48px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: var(--page-bg);
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: normal; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: var(--page-bg); font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 6.24px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: var(--page-bg); }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 12px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky, .surface-mint, .surface-lilac, .surface-sun, .surface-peach { background: var(--surface); border-color: var(--border); }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { position: relative; padding-bottom: 14.56px; background: var(--brand-header); color: #fff; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { flex: 1; min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: normal; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 16.64px 12.48px; color: #ffffffcf; font-size: 12px; line-height: 1.5; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.header-actions { display: flex; flex: none; align-items: center; justify-content: flex-end; }

.header-actions { position: relative; color: #fff; }

.signup-page { box-sizing: border-box; min-height: 100vh; padding: 0 12.48px 93.6px; background: transparent; }
.signup-hero { position: relative; overflow: hidden; color: var(--text); background: var(--surface); border-color: var(--border); box-shadow: none; }
.signup-hero::before { position: absolute; top: 0; right: 0; width: 6.24px; height: 100%; background: var(--brand); content: "";  }
.hero-label { color: var(--brand); font-size: 12px; font-weight: 600; }
.signup-title { margin-top: 9.36px; overflow-wrap: anywhere; }
.signup-time { margin-top: 12.48px; font-size: 14px; line-height: 1.45; }
.signup-place { margin-top: 4.16px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.signup-by { margin-top: 11.44px; padding-top: 8.32px; border-top: 0.52px solid var(--border); color: var(--text-secondary); font-size: 12px; }
.selection-section { margin-top: 14.56px; }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8.32px; margin: 0 1.04px 7.28px; }
.section-title { font-size: 18px; line-height: 1.4; font-weight: 600; }
.required-mark { color: var(--brand); font-size: 12px; }
.group-options { display: flex; flex-direction: column; gap: 5.2px; }
.group-option { display: flex; align-items: center; justify-content: space-between; gap: 8.32px; min-height: 52px; box-sizing: border-box; background: #ffffff; }
.group-option-full { opacity: .55; }
.group-option-main { flex: 1; min-width: 0; }
.group-option-name { line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.group-option-pace { margin-left: 5.2px; color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.group-option-sub { margin-top: 2.6px; color: var(--text-secondary); font-size: 12px; line-height: 1.35; }
.group-state { flex: none; min-width: 31.2px; text-align: right; }
.group-option-on .group-state { color: var(--brand); font-weight: 600; }
.group-option-full .group-state { color: var(--text-secondary); }
.no-groups { padding: 13.52px 10.4px;  background: #fff; color: var(--text-secondary); font-size: 12px; }
.signup-deadline { margin: 7.28px 2.08px 0; color: var(--brand); font-size: 12px; line-height: 1.45; }
.optional-section { margin-top: 14.56px;  background: #ffffff; }
.optional-toggle { display: flex; justify-content: space-between; gap: 8.32px; min-height:44px; }
.optional-title { font-weight: 600; }
.optional-caption { margin-left: 5.2px; color: var(--text-secondary); }
.optional-arrow { flex: none; color: var(--brand); font-size: 12px; }
.optional-fields { padding: 0 10.4px 11.44px; }
.field-label { margin: 2.08px 0 5.2px; color: var(--text-secondary); font-size: 12px; }
.choice-row { display: flex; gap: 5.2px; }
.choice { flex: 1; min-width: 0; min-height: 44px; height: 44px; color: var(--text-secondary); text-align: center; }
.choice-on { font-weight: 600; }
.level-label { margin-top: 11.44px; }
.level-list { overflow: hidden; border-radius: 4.16px; background: var(--lilac-soft); }
.level-option { display: flex; align-items: center; gap: 6.24px; min-height:44px; padding: 6.24px 7.28px; border-bottom: 0.52px solid var(--border); }
.level-option:last-child { border-bottom: 0; }
.level-name { flex: none; width: 37.44px; font-size: 12px; font-weight: 600; }
.level-description { flex: 1; min-width: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
.level-check { flex: none; width: 27.04px; color: var(--brand); font-size: 12px; text-align: right; }
.error-line { margin-top: 8.32px; color: var(--brand); font-size: 12px; line-height: 1.5; }
.action-hint { margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.bottom-space { height: 10.4px; }
.submit-bar { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 9.36px; box-sizing: border-box; min-height: 60.32px; padding: 8.32px 12.48px; padding-bottom: calc(8.32px + env(safe-area-inset-bottom)); border-top: 0.52px solid var(--border); background: rgba(255,255,255,.98); }
.submit-count { display: flex; align-items: baseline; gap: 3.12px; flex: 1; min-width: 0; }
.count-number { font-size: 18px; font-weight: 600; }
.count-label { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.submit-button { flex: none; width: 187.2px; height: 42.64px; min-height:44px; margin: 0; padding: 0 8.32px;  background: var(--brand); color: #fff; font-size: 12px; line-height: 42.64px; }
.submit-button[disabled] { background: var(--border); color: var(--text-secondary);  }
.load-state { display: flex; align-items: center; flex-direction: column; justify-content: center; min-height: 70vh; padding: 20.8px; color: var(--text-secondary); font-size: 12px; text-align: center; }
.load-mark { display: flex; align-items: center; justify-content: center; width: 47.84px; height: 47.84px; margin-bottom: 10.4px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 600; }
.retry-button { min-height:44px; margin-top: 12.48px; padding: 0 14.56px;  background: var(--brand); color: #fff; font-size: 12px; line-height: 37.44px; }

@media (max-width: 350px) {
  .signup-title { font-size: 24px; }
  .submit-bar { gap: 5.2px; padding-right: 12.48px; padding-left: 12.48px; }
  .submit-button { width: 156px; font-size: 12px;  }
  .level-option { gap: 4.16px; padding-right: 5.2px; padding-left: 5.2px; }
  .level-description { font-size: 12px; }
}

/* Use layout centering instead of inherited native button line heights. */
.signup-page button { display: flex; align-items: center; justify-content: center; line-height: 1.35; box-sizing: border-box; }

.signup-hero { margin: 12.48px 0 0; background: var(--surface); border-color: var(--border); box-shadow: none; }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-signup-signup .signup-hero, .mini-signup-signup .group-option, .mini-signup-signup .optional-section, .mini-signup-signup .no-groups { border-radius: 12.48px; }
.mini-signup-signup .submit-button, .mini-signup-signup .retry-button { border-radius: 12.48px; }
.mini-signup-signup .choice { border-radius: 7.28px; }
.mini-signup-signup { color: var(--text); }
.mini-signup-signup button { font-weight: 500; border-radius: 12.48px; }

.signup-page { background: transparent; color: var(--text); }
.signup-hero { padding: 15.6px; border: 1px solid var(--border); background: var(--surface); border-color: var(--border); box-shadow: none; }
.signup-title { font-size: 24px; font-weight: 600; line-height: 1.45; }
.hero-label,.signup-by,.group-option-sub { font-size: 12px; }
.signup-time,.signup-place { font-size: 13px; }
.group-option { padding: 14.56px; border: 1px solid var(--border); background: #ffffff; }
.group-option-on { border-color: var(--brand); background: var(--surface); }
.group-option-name { font-size: 15px; }
.group-state { color: var(--brand); font-size: 12px; }
.optional-section { border: 1px solid var(--border); background: #ffffff; }
.optional-toggle { align-items: flex-start; padding: 12.48px; }
.optional-title { display: block; font-size: 13px; }
.optional-caption { display: block; margin: 4.16px 0 0; font-size: 12px; line-height: 1.7; }
.choice { display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 7.28px; background: #fff; font-size: 12px; line-height: 1.4; }
.choice-on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.submit-bar .submit-button { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12.48px; line-height: 1.4; background: var(--brand); }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-signup-signup .submit-button { font-size: 14px; font-weight: 500; }
.mini-signup-signup .retry-button { font-size: 13px; font-weight: 500; }
.submit-bar .submit-button { font-size: 14px; }

</style></head><body><div class="signup-page mini-signup-signup">
  <div class="signup-hero">
    <div class="hero-label">报名活动</div>
    <div class="signup-title">周三西湖夜跑 · 稳稳向前</div>
    <div class="signup-time">19:00–20:30</div>
    <div class="signup-place">公园南门广场<span> · 10 公里</span></div>
    <div class="signup-by">以 向前跑 的身份报名</div>
  </div>

  <div class="selection-section">
    <div class="section-heading"><span class="section-title">选择组别</span><span class="required-mark">必选</span></div>
    <div class="group-options">
      <div class="group-option group-option-on ">
        <div class="group-option-main"><div class="group-option-name">轻松跑 A 组<span class="group-option-pace">6′00″–6′30″</span></div><div class="group-option-sub">配速组 · 8/20已报名</div></div>
        <div class="group-state">已选</div>
      </div><div class="group-option  ">
        <div class="group-option-main"><div class="group-option-name">进阶跑 B 组<span class="group-option-pace">5′00″–5′30″</span></div><div class="group-option-sub">配速组 · 4/10已报名</div></div>
        <div class="group-state">选择</div>
      </div>
    </div>
    
    
  </div>

  <div class="optional-section">
    <div class="optional-toggle"><div><span class="optional-title">其他信息</span><span class="optional-caption">性别和跑步水平可不填，仅活动组织者可见，用于现场协调</span></div><span class="optional-arrow">填写</span></div>
    
  </div>

  
  
  <div class="bottom-space"></div>
  <div class="submit-bar">
    <div class="submit-count"><span class="count-number">0</span><span class="count-label">人已报名</span></div>
    <button class="submit-button" loading="false">确认报名</button>
  </div>
</div>


</body></html>
