  --brand: #c54332;
  --brand-soft: #f8eee9;
  --page-bg: #f7f7f4;
  --surface: #ffffff;
  --text: #252923;
  --text-secondary: #6f756c;
  --border: #e3e6df;
  --control-radius: 10.24px;
  --card-radius: 15.36px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.4266666666666667px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.4266666666666667px solid var(--border);
  border-radius: 8.533333333333333px;
  background: #fafbf8;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 10.24px; }
textarea { min-height: 120px; padding: 10.24px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #92978e; }
.pad { padding: 13.653333333333334px 13.653333333333334px calc(20.48px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.24px;
  padding: 13.653333333333334px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.128px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 10.24px; margin-top: 5.12px; padding: 7.68px 8.533333333333333px; border-radius: 6.826666666666667px; background: #f3f5ef; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }

.row:last-child { border-bottom: 0; }

.soon { color: #a06a2e; }
.err { margin-top: 5.12px; color: #ad382b; font-size: 12px; line-height: 1.7; }
.note { margin-top: 5.12px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 23.893333333333334px 13.653333333333334px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 6.826666666666667px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 10.24px; border-radius: 8.533333333333333px; background: #fafbf8; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.4266666666666667px solid transparent;
  border-radius: var(--control-radius);
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 10.24px; }
button.ghost {
  min-height: 44px;
  margin: 6.826666666666667px 6.826666666666667px 0 0;
  padding: 10px 16px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #d8b4a9; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #e8eae4; background: #edf0e9; color: #93998e; opacity: 1; }
.chip { display: inline-block; margin-right: 3.4133333333333336px; padding: 1.7066666666666668px 5.12px; border: 0.4266666666666667px solid #e7eae2; border-radius: 5.12px; background: #f3f5ef; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 8.533333333333333px; margin-top: 6.826666666666667px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 5.12px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 8.533333333333333px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 10.24px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }

.ui-control-danger { border-color: #ead6ce; background: #fcf4ef; color: #a33829; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
