<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#d8ded5;position:relative}.native-switch[checked=true]{background:#c54332}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #c54332;
  --brand-soft: #f8eee9;
  --page-bg: #f7f7f4;
  --surface: #ffffff;
  --text: #252923;
  --text-secondary: #6f756c;
  --border: #e3e6df;
  --control-radius: 12.48px;
  --card-radius: 18.72px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: #fafbf8;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #92978e; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.156px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: #f3f5ef; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #a06a2e; }
.err { margin-top: 6.24px; color: #ad382b; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: #fafbf8; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #d8b4a9; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #e8eae4; background: #edf0e9; color: #93998e; opacity: 1; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #e7eae2; border-radius: 6.24px; background: #f3f5ef; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #ead6ce; background: #fcf4ef; color: #a33829; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: #f7f7f4; color: #252923; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.26px; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 16.64px 12.48px; color: #6f756c; font-size: 12px; line-height: 1.7; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.club-detail { min-height: 100vh; box-sizing: border-box; padding: 16.64px calc(33.28px + env(safe-area-inset-bottom)); }
.club-detail .card { box-sizing: border-box; margin-bottom: 12.48px; padding: 16.64px; border: 0.52px solid #e3e6df; border-radius: 18.72px; }
.club-detail .detail-hero { padding: 19.76px 16.64px; background: linear-gradient(140deg, #fff 62%, #faf8f2); }
.club-detail .detail-hero .h2 { margin: 7.28px 0 10.4px; font-size: 22px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.club-detail .detail-kicker { color: #c54332; font-size: 12px; font-weight: 600; letter-spacing: 1.04px; }
.club-detail .h2 { font-size: 16px; font-weight: 600; line-height: 1.4; }
.club-detail .src { color: #6f756c; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.club-detail .sum { margin-top: 14.56px; padding: 10.4px 12.48px; border-radius: 9.36px; background: #f5f7f1; color: #50574c; font-size: 12px; line-height: 1.6; }
.club-detail button.btn, .club-detail button.ghost, .club-detail .fold-toggle { display: flex; align-items: center; justify-content: center; min-height:44px; height: auto; box-sizing: border-box; padding: 10.4px 12.48px; line-height: 1.35; font-size: 14px; text-align: center; }
.club-detail button.btn { margin-top: 12.48px; border-radius:12.48px; }
.club-detail button.ghost { margin: 8.32px 0 0; border: 0.52px solid #e3e6df; border-radius:12.48px; background: #f5f7f1; color: #50574c; font-size: 12px; }
.club-detail button.ghost.on { border-color: #d8b4a9; background: #f8eee9; color: #c54332; }
.club-detail button[disabled] { color: #6f756c; background: #edf0e9; }
.club-detail .fold-toggle { justify-content: space-between; width: 100%; min-height:44px; margin: 9.36px 0 0; padding: 8.32px 0; border-radius: 0; background: transparent; color: #6f756c; font-size: 12px; text-align: left; }
.club-detail .fold-toggle span:last-child { color: #6f756c; font-size: 18px; }
.club-detail .management-card > .fold-toggle { margin-top: 0; color: #50574c; font-size: 14px; font-weight: 600; }
.club-detail .share-copy { max-height: 270.4px; margin-top: 6.24px; padding: 12.48px; overflow-y: auto; border-radius: 9.36px; background: #f5f7f1; color: #6f756c; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.club-detail .row { align-items: center; padding: 12.48px 0; font-size: 12px; }
.club-detail .row span { min-width: 0; overflow-wrap: anywhere; }
.club-detail .row span:last-child { flex-shrink: 0; max-width: 48%; text-align: right; font-variant-numeric: tabular-nums; }
.club-detail input { height: 45.76px; border: 0.52px solid #e3e6df; background: #f5f7f1; font-size: 14px; }
.club-detail .detail-actions { display: flex; flex-wrap: wrap; gap: 8.32px; margin-top: 12.48px; }
.club-detail .detail-actions button.ghost { flex: 1; margin-top: 0; }

.club-detail .detail-options { display: flex; flex-wrap: wrap; gap: 6.24px; margin-top: 10.4px; }
.club-detail .detail-options button.ghost { flex: 1 1 42%; min-width: 0; margin: 0; }
.club-detail .detail-select { display: flex; align-items: center; justify-content: space-between; min-height:44px; margin-top: 10.4px; padding: 0 12.48px; border: 0.52px solid #e3e6df; border-radius: 9.36px; background: #f5f7f1; color: #50574c; font-size: 12px; }

.src { color: var(--text-secondary); font-size: 12px; margin-top: 4.16px; white-space: pre-wrap; }
.sum { margin-top: 8.32px; font-weight: 650; }
.qr { width: 100%; margin-top: 8.32px; border-radius: 6.24px; }
.card .btn { margin-top: 8.32px;  }
.meetup-state { margin: 16.64px; padding: 24.96px 16.64px;  background: #fff; text-align: center; }
.state-title { color: var(--text); font-size: 18px; font-weight: 600; }
.meetup-state .btn { margin-top: 14.56px;  }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-meetup-meetup .card, .mini-meetup-meetup .meetup-state { border-radius: 18.72px; }
.mini-meetup-meetup .btn, .mini-meetup-meetup .ghost, .mini-meetup-meetup .fold-toggle { border-radius: 12.48px; }

/* Page composition and interaction hierarchy. */
.mini-meetup-meetup { color: var(--text); }
.mini-meetup-meetup button { font-weight: 500; border-radius: 12.48px; }

.club-detail .card { border: 1px solid var(--border); }
.club-detail .title { font-size: 24px; font-weight: 600; line-height: 1.5; }
.sum,.share-copy { font-size: 14px; line-height: 1.8; }
.row { gap: 10.4px; padding: 12.48px 0; font-size: 14px; }
input,textarea { width: 100%; min-height: 44px; padding: 9.36px 11.44px; border: 1px solid var(--border); border-radius: 12.48px; background: var(--page-bg); font-size: 14px; box-sizing: border-box; }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-meetup-meetup .btn { font-size: 14px; font-weight: 500; }
.mini-meetup-meetup .ghost, .mini-meetup-meetup .fold-toggle { font-size: 13px; font-weight: 500; }
</style></head><body><div class="page club-detail mini-meetup-meetup">
  <div class="card detail-hero"><div class="detail-kicker">一起出发 · 约跑</div>
    <div class="h2">11月07日 周六 西湖柳浪闻莺</div>

  </div>

</body></html>
