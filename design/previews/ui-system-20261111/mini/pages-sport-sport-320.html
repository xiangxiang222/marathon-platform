ht:44px; margin: 0; padding: 0 10.24px;  background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; line-height: 37.54666666666667px; }.primary::after,.secondary::after,.delete-button::after,.choices button::after { border: 0;  }.manual-note { margin: 6.826666666666667px 0 17.066666666666666px; text-align: center; color: var(--text-secondary); font-size: 12px; line-height: 15.36px; }.section-title { font-size: 19px; line-height: 20.48px; font-weight: 600; }.records-heading { margin: 17.066666666666666px 3.4133333333333336px 10.24px; }.records-title { font-size: 20px; line-height: 22.186666666666667px; font-weight: 600; }.run-date { margin: 5.12px 0 11.946666666666667px; color: var(--text-secondary); font-size: 12px; line-height: 15.36px; }.record-data { display: flex; gap: 5.973333333333334px;  padding: 10.24px 0;}.record-data > div { flex: 1; min-width: 0; }.record-number { display: block; font-size: 18px; line-height: 1.4; font-weight: 600; }.record-unit { display: block; margin-top: 2.56px; color: var(--text-secondary); font-size: 12px; }.hint { margin-top: 8.533333333333333px; color: var(--text-secondary); font-size: 12px; line-height: 16.213333333333335px; }.stack { display: flex; flex-direction: column; gap: 10.24px; margin-top: 11.946666666666667px; }.stack input { width: 100%; min-width: 0; height: 37.54666666666667px; padding: 0 10.24px; border: 0; border-radius: 6.826666666666667px; background: var(--page-bg); color: var(--text); font-size: 14px; box-sizing: border-box; }.stack > .field-label + input { margin-top: -5.12px; }.field-pair { display: flex; gap: 8.533333333333333px; }.field-pair > div { flex: 1; min-width: 0; }.field-pair input,.picker-value { margin-top: 5.12px;  }.picker-value { height: 37.54666666666667px; padding: 0 10.24px;  background: var(--page-bg); font-size: 14px; line-height: 37.54666666666667px; }.choices { display: flex; gap: 6.826666666666667px;  }.choices button { flex: none; min-width: 52.906666666666666px; min-height:44px; margin: 0; padding: 0 10.24px;  background: #f2f2f2; color: var(--text); font-size: 14px; line-height: 30.72px; }.choices button.on { color: var(--brand); background: var(--brand-soft);  }.close-button { display: flex; align-items: center; min-height: 44px; padding: 5.12px 0; color: var(--text-secondary); font-size: 12px; }.secondary { width: 100%; min-height:44px; margin: 0; padding: 0 10.24px;  background: #f2f2f2; color: var(--text); font-size: 12px; line-height: 37.54666666666667px; }.record-editor { margin-top: 13.653333333333334px; padding-top: 10.24px; border-top: 0.4266666666666667px solid var(--border); }.delete-button { min-height:44px; margin: 0; color: var(--text-secondary); background: transparent; font-size: 12px; line-height: 34.13333333333333px; }.shot { display: block; width: 100%; margin-top: 10.24px; border-radius: 6.826666666666667px; }.guest-state,.empty-state { padding: 23.893333333333334px 17.066666666666666px; text-align: center; }.guest-title { margin-top: 10.24px; font-size: 24px; line-height: 23.893333333333334px; font-weight: 600; }.guest-state .hint { margin: 6.826666666666667px 0 17.066666666666666px; }.guest-mark { display: flex; align-items: center; justify-content: center; width: 47.78666666666667px; height: 47.78666666666667px; margin: auto; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 25.6px; }.year-note,.loading-copy { margin: 13.653333333333334px 3.4133333333333336px; color: var(--text-secondary); font-size: 12px; line-height: 17.066666666666666px; }.message { margin: 10.24px 3.4133333333333336px; color: var(--brand); font-size: 12px; line-height: 17.066666666666666px; }
