      <div class="topline"><div class="eyebrow"><span class="brand-dash"></span>奥森悦跑团</div></div>
      <div class="heading">下一次，一起出发<span class="heading-dot">.</span></div>
      <div class="page-intro">选一份模板，或安排全新的一场。</div>
      <div class="steps">
        <div class="step current"><span class="step-number">01</span><span>时间地点</span></div><div class="step-line"></div>
        <div class="step "><span class="step-number">02</span><span>训练安排</span></div><div class="step-line"></div>
        <div class="step "><span class="step-number">03</span><span>预览发布</span></div>
      </div>
      
      
      
      
        <div class="template-studio">
          <div class="section-head"><div><div class="section-kicker">少填几次，多跑几次</div><div class="section-title">从常用训练开始</div></div></div>
          <div class="preset-row"><button class="preset-card " data-source="preset" data-id="easy"><div class="preset-top"><span class="preset-mark">E</span><span class="preset-arrow">↗</span></div><span class="preset-name">轻松跑</span><span class="preset-tag">轻松有氧</span></button><button class="preset-card " data-source="preset" data-id="interval"><div class="preset-top"><span class="preset-mark">I</span><span class="preset-arrow">↗</span></div><span class="preset-name">间歇跑</span><span class="preset-tag">速度与节奏</span></button><button class="preset-card " data-source="preset" data-id="long"><div class="preset-top"><span class="preset-mark">L</span><span class="preset-arrow">↗</span></div><span class="preset-name">长距离</span><span class="preset-tag">耐力积累</span></button></div>
          <div class="library-head"><span>跑团的训练模板 <span class="library-count">1</span></span><button class="text-button">＋ 新建模板</button></div>
          
            
            
            <div class="template-scroll" scroll-x="true" show-scrollbar="false"><div class="saved-template "><button class="saved-template-use" data-source="saved" data-id="91"><span class="saved-template-name">周三间歇模板</span><span class="saved-template-meta">06:30 · 1 个分组</span><span class="saved-template-cta">使用模板 ↗</span></button><button class="template-menu" aria-label="管理模板" data-id="91">•••</button></div></div>
            
          
        </div>
        <div class="form-area">
          <div class="section-head"><div><div class="section-kicker">01 / 时间与地点</div><div class="section-title">定下这一次相聚</div></div><span class="step-caption">北京时间</span></div>
          
          <div class="label">活动名称 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="填写训练标题" value="" data-key="title" aria-label="活动名称" style="">
          <div class="type-row"><button class="type-option " data-id="easy">轻松跑</button><button class="type-option " data-id="long">长距离</button><button class="type-option " data-id="interval">间歇训练</button><button class="type-option type-selected" data-id="custom">自由安排</button></div>
          <div class="two-col"><div class="col"><div class="label">活动日期 <span class="required">必填</span></div><div mode="date" value="" data-key="startDate"><div class="picker-field placeholder">选择日期<span>⌄</span></div></div></div><div class="col"><div class="label">开始时间 <span class="required">必填</span></div><div mode="time" value="" data-key="startTime"><div class="picker-field placeholder">选择时间<span>⌄</span></div></div></div></div>
          
          <div class="label">活动地点 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="公园、跑道或训练区域" value="" data-key="place" aria-label="活动地点" style="">
          <div class="label">具体集合点 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="例如：南园南门，地铁 A 出口" value="" data-key="gatherPlace" aria-label="具体集合点" style="">
          <div class="label">计划里程 <span class="optional">公里 · 可选</span></div><input class="field" type="digit" placeholder="按本次计划填写" value="" data-key="plannedKm" aria-label="计划里程公里" style="">
          <button class="disclosure"><div><div class="disclosure-title">更多时间与报名设置</div><div class="subtle">结束时间、集合时刻、报名截止与路线</div></div><span>＋</span></button>
          
        </div>
      
      
      
      
      <div class="bottom-actions"><button class="save-action">保存草稿</button><button class="next-action">继续 <span>→</span></button></div>
    
  
</div>
