      <div class="steps">
        <div class="step current"><span class="step-number">01</span><span>常用信息</span></div><div class="step-line"></div>
        <div class="step "><span class="step-number">02</span><span>训练安排</span></div><div class="step-line"></div>
        <div class="step "><span class="step-number">03</span><span>确认保存</span></div>
      </div>
      
      <div class="success-note">✓ 已套用「长距离」，可继续调整</div>
      <div class="editing-banner"><div><span class="editing-dot"></span>正在新建跑团模板</div><span>不会发布活动</span></div>
      
        <div class="template-studio">
          <div class="section-head"><div><div class="section-kicker">少填几次，多跑几次</div><div class="section-title">从常用训练开始</div></div></div>
          <div class="preset-row"><button class="preset-card " data-source="preset" data-id="easy"><div class="preset-top"><span class="preset-mark">E</span><span class="preset-arrow">↗</span></div><span class="preset-name">轻松跑</span><span class="preset-tag">轻松有氧</span></button><button class="preset-card " data-source="preset" data-id="interval"><div class="preset-top"><span class="preset-mark">I</span><span class="preset-arrow">↗</span></div><span class="preset-name">间歇跑</span><span class="preset-tag">速度与节奏</span></button><button class="preset-card preset-active" data-source="preset" data-id="long"><div class="preset-top"><span class="preset-mark">L</span><span class="preset-arrow">✓</span></div><span class="preset-name">长距离</span><span class="preset-tag">耐力积累</span></button></div>
          
          
        </div>
        <div class="form-area">
          <div class="section-head"><div><div class="section-kicker">01 / 常用信息</div><div class="section-title">下一次，不必重新填</div></div><span class="step-caption">按需填写</span></div>
          <div class="label">模板名称 <span class="required">必填</span></div><input class="field" maxlength="30" placeholder="例如：周三间歇、周末长距离" value="" aria-label="模板名称" style="">
          <div class="label">活动默认标题 <span class="required">可用模板名称</span></div><input class="field" maxlength="40" placeholder="例如：周末长距离" value="周末长距离" data-key="title" aria-label="活动名称" style="">
          <div class="type-row"><button class="type-option " data-id="easy">轻松跑</button><button class="type-option type-selected" data-id="long">长距离</button><button class="type-option " data-id="interval">间歇训练</button><button class="type-option " data-id="custom">自由安排</button></div>
          
          <div class="two-col"><div class="col"><div class="label">常用开始时间</div><div mode="time" value="" data-key="startTime"><div class="picker-field">每次另选<span>⌄</span></div></div></div><div class="col"><div class="label">预计时长 <span class="optional">分钟</span></div><input class="field" type="number" placeholder="可不填" value="" data-key="durationMinutes" aria-label="预计时长分钟" style=""></div></div>
          <div class="label">活动地点 <span class="required">可稍后补充</span></div><input class="field" maxlength="40" placeholder="公园、跑道或训练区域" value="" data-key="place" aria-label="活动地点" style="">
          <div class="label">具体集合点 <span class="required">可稍后补充</span></div><input class="field" maxlength="40" placeholder="例如：南园南门，地铁 A 出口" value="" data-key="gatherPlace" aria-label="具体集合点" style="">
          <div class="label">计划里程 <span class="optional">公里 · 可选</span></div><input class="field" type="digit" placeholder="按本次计划填写" value="" data-key="plannedKm" aria-label="计划里程公里" style="">
          <button class="disclosure"><div><div class="disclosure-title">更多时间与报名设置</div><div class="subtle">集合时刻、路线与提前截止时间</div></div><span>−</span></button>
          <div class="extra-fields">
            
            <div class="label">集合时间 <span class="optional">可选</span></div><input class="field" maxlength="40" placeholder="例如：06:20，或提前 10 分钟集合" value="提前 10 分钟" data-key="gatherAt" aria-label="集合时间说明" style="">
            
            <div class="label">路线说明 <span class="optional">可选</span></div><input class="field" maxlength="200" placeholder="路线、补水点或交通提示" value="" data-key="route" aria-label="路线说明" style="">
            <div class="label">报名提前截止 <span class="optional">分钟 · 可选</span></div><input class="field" type="number" placeholder="例如 60，开始前 1 小时截止" value="" data-key="signupLeadMinutes" aria-label="报名提前截止分钟" style=""><div class="label">取消提前截止 <span class="optional">分钟 · 可选</span></div><input class="field" type="number" placeholder="例如 120，开始前 2 小时截止" value="" data-key="cancelLeadMinutes" aria-label="取消提前截止分钟" style="">
            
          </div>
        </div>
      
      
      
      
      <div class="bottom-actions"><button class="save-action">退出编辑</button><button class="next-action">继续 <span>→</span></button></div>
    
  
</div>
