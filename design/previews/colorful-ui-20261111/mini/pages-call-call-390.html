<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#e1251b}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f6f8;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #737373;
  --border: #eaedf1;
  --sky: #2767aa;
  --sky-soft: #eaf4ff;
  --mint: #23765f;
  --mint-soft: #e9f7f2;
  --lilac: #7753ae;
  --lilac-soft: #f2edff;
  --sun: #986614;
  --sun-soft: #fff4d7;
  --peach-soft: #fff0e7;
  --card-shadow: 0 2.08px 12.48px rgba(42, 61, 105, .025);
  --action-fill: linear-gradient(120deg, #e1251b, #cf3025);
  --control-radius: 12.48px;
  --card-radius: 18.72px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: #f8faff;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.156px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: #f0f5fc; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 6.24px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: #f8faff; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: 0 3.12px 10.4px rgba(225, 37, 27, .14);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #f4bdb8; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky { background: linear-gradient(135deg, #f8fcff, var(--sky-soft)); border-color: #d9e9fb; }
.surface-mint { background: linear-gradient(135deg, #fbfffd, var(--mint-soft)); border-color: #d5eee4; }
.surface-lilac { background: linear-gradient(135deg, #fdfbff, var(--lilac-soft)); border-color: #e4d9f7; }
.surface-sun { background: linear-gradient(135deg, #fffdf7, var(--sun-soft)); border-color: #f3e4b8; }
.surface-peach { background: linear-gradient(135deg, #fffaf7, var(--peach-soft)); border-color: #f6dcd0; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: transparent; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.26px; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 16.64px 12.48px; color: #737373; font-size: 12px; line-height: 1.7; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.club-detail { min-height: 100vh; box-sizing: border-box; padding: 16.64px 16.64px calc(33.28px + env(safe-area-inset-bottom)); }
.club-detail .card { box-sizing: border-box; margin-bottom: 12.48px; padding: 16.64px; border: 0.52px solid #ebebed; border-radius: 18.72px; }
.club-detail .detail-hero { padding: 19.76px 16.64px; background: linear-gradient(140deg, #fff 62%, #fff8f7); }
.club-detail .detail-hero .h2 { margin: 7.28px 0 10.4px; font-size: 22px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.club-detail .detail-kicker { color: #e1251b; font-size: 12px; font-weight: 600; letter-spacing: 1.04px; }
.club-detail .h2 { font-size: 16px; font-weight: 600; line-height: 1.4; }
.club-detail .src { color: #737373; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.club-detail .sum { margin-top: 14.56px; padding: 10.4px 12.48px; border-radius: 9.36px; background: #f7f7f8; color: #595959; font-size: 12px; line-height: 1.6; }
.club-detail button.btn, .club-detail button.ghost, .club-detail .fold-toggle { display: flex; align-items: center; justify-content: center; min-height:44px; height: auto; box-sizing: border-box; padding: 10.4px 12.48px; line-height: 1.35; font-size: 14px; text-align: center; }
.club-detail button.btn { margin-top: 12.48px; border-radius:12.48px; }
.club-detail button.ghost { margin: 8.32px 0 0; border: 0.52px solid #ebebed; border-radius:12.48px; background: #f7f7f8; color: #595959; font-size: 12px; }
.club-detail button.ghost.on { border-color: #f4bdb8; background: #fff2f0; color: #e1251b; }
.club-detail button[disabled] { color: #737373; background: #f2f2f2; }
.club-detail .fold-toggle { justify-content: space-between; width: 100%; min-height:44px; margin: 9.36px 0 0; padding: 8.32px 0; border-radius: 0; background: transparent; color: #737373; font-size: 12px; text-align: left; }
.club-detail .fold-toggle span:last-child { color: #737373; font-size: 18px; }
.club-detail .management-card > .fold-toggle { margin-top: 0; color: #595959; font-size: 14px; font-weight: 600; }
.club-detail .share-copy { max-height: 270.4px; margin-top: 6.24px; padding: 12.48px; overflow-y: auto; border-radius: 9.36px; background: #f7f7f8; color: #737373; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.club-detail .row { align-items: center; padding: 12.48px 0; font-size: 12px; }
.club-detail .row span { min-width: 0; overflow-wrap: anywhere; }
.club-detail .row span:last-child { flex-shrink: 0; max-width: 48%; text-align: right; font-variant-numeric: tabular-nums; }
.club-detail input { height: 45.76px; border: 0.52px solid #ebebed; background: #f7f7f8; font-size: 14px; }
.club-detail .detail-actions { display: flex; flex-wrap: wrap; gap: 8.32px; margin-top: 12.48px; }
.club-detail .detail-actions button.ghost { flex: 1; margin-top: 0; }

.club-detail .detail-options { display: flex; flex-wrap: wrap; gap: 6.24px; margin-top: 10.4px; }
.club-detail .detail-options button.ghost { flex: 1 1 42%; min-width: 0; margin: 0; }
.club-detail .detail-select { display: flex; align-items: center; justify-content: space-between; min-height:44px; margin-top: 10.4px; padding: 0 12.48px; border: 0.52px solid #ebebed; border-radius: 9.36px; background: #f7f7f8; color: #595959; font-size: 12px; }

.src { color: var(--text-secondary); font-size: 12px; margin-top: 4.16px; white-space: pre-wrap; }
.sum { margin-top: 8.32px; font-weight: 650; background: rgba(255,255,255,.65); }
.stack input { width: 100%; height: 41.6px; margin-top: 8.32px; background: var(--page-bg); border-radius: 8.32px; padding: 0 10.4px; box-sizing: border-box; }
img { width: 100%; margin-top: 4.16px; border-radius: 6.24px; }
.drop { color: var(--brand); font-size: 12px; }
input { width: 100%; height: 41.6px; margin-top: 8.32px; background: var(--page-bg); border-radius: 8.32px; padding: 0 10.4px; box-sizing: border-box; }
.call-poster-canvas { position: fixed; left: -2000px; top: 0; width: 1px; height: 1px; pointer-events: none; }
.poster-layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12.48px; box-sizing: border-box; background: rgba(20, 22, 28, .76); }
.poster-frame { width: 100%; max-width: 353.6px; max-height: 92vh; overflow-y: auto; text-align: center; }
.poster-image { display: block; width: 100%; border-radius: 6.24px; }
.poster-hint { padding: 9.36px 0; color: #fff; font-size: 12px; }

.detail-state { margin: 16.64px; padding: 20.8px 14.56px;  background: var(--sky-soft); text-align: center; }
.state-title { font-size: 18px; font-weight: 600; }
.detail-state .btn { margin-top: 14.56px; display: flex; align-items: center; justify-content: center; min-height:44px; line-height: 1.35;  }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-call-call .card, .mini-call-call .detail-state { border-radius: 18.72px; }
.mini-call-call .btn, .mini-call-call .ghost, .mini-call-call .fold-toggle { border-radius: 12.48px; }

/* Page composition and interaction hierarchy. */
.mini-call-call { color: var(--text); background: transparent; }
.mini-call-call button { font-weight: 500; border-radius: 12.48px; }

.club-detail .card { border: 1px solid var(--border); }
.club-detail .title { font-size: 24px; font-weight: 600; line-height: 1.5; }
.detail-options { border-bottom: 1px solid var(--border); }
.detail-options .ghost { border-radius: 0; background: transparent; font-size: 13px; }
.detail-options .ghost.on { color: var(--text); box-shadow: inset 0 -2px var(--brand); background: transparent; }
.stack input,input { min-height: 44px; border: 1px solid var(--border); border-radius: 12.48px; background: var(--page-bg); font-size: 14px; }
.sum { padding: 12.48px; border-radius: 12.48px; background: rgba(255,255,255,.65); font-size: 14px; line-height: 1.8; }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-call-call .btn { font-size: 14px; font-weight: 500; }
.mini-call-call .ghost, .mini-call-call .fold-toggle { font-size: 13px; font-weight: 500; }

/* Existing semantic sections receive distinct light color surfaces. */
.detail-hero { background: linear-gradient(135deg,#eaf4ff,#ffffff); box-shadow: var(--card-shadow); }
.mini-call-call > .card:nth-child(2) { background: #ffffff; }
</style></head><body><div class="pad club-detail mini-call-call">
  <div class="card detail-hero"><div class="detail-kicker">每一份努力，值得记录</div>
    <div class="h2">杭州马拉松成绩接龙</div>
    <div class="src">2026-11-15 · 截止 11月20日 22:00</div>
    
    <div class="sum">已记录 16 位跑友的完赛成绩</div>
    <button class="fold-toggle"><span>查看接龙文字</span><span>+</span></button>
    <div class="detail-actions"><button class="ghost" open-type="share">邀请接龙</button>
    <button class="ghost">复制成绩榜</button>
    <button class="ghost">生成成绩长图</button></div>
  </div>
  <div class="card">
    <div class="h2">记录我的成绩</div>
    <div class="src">距离：还没选</div>
    <div class="detail-options"><button class="ghost ">全程马拉松</button><button class="ghost ">半程马拉松</button></div>
    <div class="stack">
      <input placeholder="1:32:10 或 45:30" aria-label="1:32:10 或 45:30" style="">
    </div>
    <button class="btn">提交</button>
    <button class="ghost">证书或截图</button>
    <div class="src">先提交这条距离的成绩，再上传截图。</div>
  </div>
  
  <div class="card">
    <div class="h2">全程马拉松</div>
    <div>
      <div class="row">
        <span>1 向前跑 · 我</span>
        <span>3:28:16 PB</span>
      </div>
      
      <span class="drop">删除</span>
    </div>
  </div>
  <div class="card management-card"><button class="fold-toggle"><span>接龙管理 · 截止与补录</span><span>+</span></button>
  </div>
  
  
</div>

<div type="2d" id="call-poster" class="call-poster-canvas"></div>

</body></html>
