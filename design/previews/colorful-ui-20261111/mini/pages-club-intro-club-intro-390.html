<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#e1251b}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f6f8;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #737373;
  --border: #eaedf1;
  --sky: #2767aa;
  --sky-soft: #eaf4ff;
  --mint: #23765f;
  --mint-soft: #e9f7f2;
  --lilac: #7753ae;
  --lilac-soft: #f2edff;
  --sun: #986614;
  --sun-soft: #fff4d7;
  --peach-soft: #fff0e7;
  --card-shadow: 0 2.08px 12.48px rgba(42, 61, 105, .025);
  --action-fill: linear-gradient(120deg, #e1251b, #cf3025);
  --control-radius: 12.48px;
  --card-radius: 18.72px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: #f8faff;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.156px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: #f0f5fc; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 6.24px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: #f8faff; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: 0 3.12px 10.4px rgba(225, 37, 27, .14);

  font-weight: 600;

  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #f4bdb8; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky { background: linear-gradient(135deg, #f8fcff, var(--sky-soft)); border-color: #d9e9fb; }
.surface-mint { background: linear-gradient(135deg, #fbfffd, var(--mint-soft)); border-color: #d5eee4; }
.surface-lilac { background: linear-gradient(135deg, #fdfbff, var(--lilac-soft)); border-color: #e4d9f7; }
.surface-sun { background: linear-gradient(135deg, #fffdf7, var(--sun-soft)); border-color: #f3e4b8; }
.surface-peach { background: linear-gradient(135deg, #fffaf7, var(--peach-soft)); border-color: #f6dcd0; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: transparent; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.26px; white-space: nowrap; text-overflow: ellipsis; }

@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.intro-page { min-height: 100vh; box-sizing: border-box; font-weight: 400; background: transparent; }
.intro-content { padding: 12.48px 14.56px 95.68px; padding-bottom: calc(95.68px + env(safe-area-inset-bottom)); }
.intro-card { position: relative; overflow: hidden; padding: 18.72px; border: 0.52px solid #fff;  background: linear-gradient(135deg,#eaf4ff,#ffffff); border-color: #dceaf3; box-shadow: var(--card-shadow); }
.intro-card > div:not(.track-art) { position: relative;  }
.card-eyebrow { color: var(--brand); font-size: 12px; line-height: 16.64px; letter-spacing: 2.08px; }
.track-art { position: absolute; right: -83.2px; top: -53.04px; width: 203.84px; height: 203.84px; box-sizing: border-box; border: 1.04px solid var(--border); border-radius: 50%; transform: rotate(-20deg); }
.track-line { position: absolute; border: 1.04px solid var(--border); border-radius: 50%; }
.track-line-two { inset: 14.56px; }
.track-line-three { inset: 29.12px; }
.club-mark { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; margin-top: 20.8px; border-radius:16.64px; color: #fff; background: var(--brand); font-size: 22px; font-weight: 600; box-shadow: 0 5.2px 11.44px rgba(255, 10, 48, .13); }
.club-name { margin-top: 13.52px; color: var(--text); line-height: 1.4; overflow-wrap: anywhere; word-break: break-all; }
.card-tagline { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 20.8px; }
.club-facts { display: flex; align-items: center; justify-content: space-between; gap: 12.48px; margin-top: 20.8px; padding-top: 14.56px; border-top: 0.52px solid var(--border); }
.club-owner { flex: 1; min-width: 0; font-size: 12px; line-height: 19.76px; }
.fact-label { display: block; color: var(--text-secondary); font-size: 12px; }
.fact-value { display: block; margin-top: 2.08px; overflow-wrap: anywhere; word-break: break-all; }
.club-count { display: flex; flex: none; align-items: baseline; gap: 4.16px; }
.count { color: var(--text); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

.intro-benefits { margin-top: 12.48px; padding: 16.64px 14.56px 12.48px;  background: #ffffff; }
.section-title { font-size: 20px; font-weight: 600; line-height: 22.88px; }

.icon-route::before, .icon-route::after { content: ""; position: absolute; width: 4.16px; height: 4.16px; border: 1.56px solid var(--brand); border-radius: 50%; }
.icon-route::before { left: 8.32px; top: 9.88px; }

.icon-route > div { width: 13.52px; height: 8.32px; border: 1.56px solid var(--brand); border-left: 0; border-right: 0; border-radius: 0 6.24px 0 6.24px; transform: rotate(-25deg); }
.icon-flag > div { position: relative; width: 11.44px; height: 16.64px; border-left: 1.56px solid var(--brand); }
.icon-flag > div::before { content: ""; position: absolute; left: 0; top: 0; width: 12.48px; height: 8.32px; border: 1.56px solid var(--brand); border-left: 0; border-radius: 0 2.08px 2.08px 0; }
.icon-rank { gap: 2.6px; align-items: flex-end; padding-bottom: 10.4px; box-sizing: border-box; }

.icon-rank > div:nth-child(2) { height: 16.64px; }
.icon-rank > div:nth-child(3) { height: 12.48px; }
.benefit-title { margin-top: 7.28px; line-height: 19.76px; }
.benefit-copy { margin-top: 2.08px; color: var(--text-secondary); font-size: 12px; line-height: 17.68px; }
.access-note { margin-top: 14.56px; padding-top: 10.4px; border-top: 0.52px solid var(--border); color: var(--text-secondary); font-size: 12px; line-height: 18.72px; }
.status { display: flex; align-items: flex-start; gap: 8.32px; margin-top: 12.48px; padding: 12.48px;  background: var(--mint-soft); }
.status-dot { flex: none; width: 6.24px; height: 6.24px; margin-top: 6.24px; border-radius: 50%; background: var(--brand); }

.secondary-note { margin-top: 14.56px; color: var(--text-secondary); text-align: center; font-size: 12px; line-height: 18.72px; }
.intro-dock { position: fixed; z-index: 8; display: flex; align-items: center; gap: 10.4px; left: 0; right: 0; bottom: 0; padding: 10.4px 14.56px 12.48px; padding-bottom: calc(12.48px + env(safe-area-inset-bottom)); border-top: 0.52px solid var(--border); background: #fff; }
.intro-dock button { display: flex; align-items: center; justify-content: center; min-height:44px; padding: 0 8.32px; margin: 0; border-radius: 10.4px; font-size: 14px; font-weight: 600; line-height: 1.4; }
.share-action { flex: 0 0 34%; gap: 6.24px; box-sizing: border-box; color: var(--text); background: var(--page-bg);  }
.share-glyph { position: relative; width: 13.52px; height: 13.52px; margin-top: 3.12px; border: 1.56px solid var(--text); border-top-color: transparent; border-radius: 2.6px; }
.share-glyph::before { content: ""; position: absolute; width: 1.56px; height: 11.44px; left: 5.72px; top: -6.24px; background: var(--text); }
.share-glyph::after { content: ""; position: absolute; left: 2.6px; top: -5.72px; width: 6.24px; height: 6.24px; border-top: 1.56px solid var(--text); border-left: 1.56px solid var(--text); transform: rotate(45deg); }
.action { flex: 1; color: #fff; background: var(--brand);  }
.intro-dock button.pending-action { color: var(--text-secondary); background: var(--page-bg); }
.state { padding: 72.8px 20.8px 20.8px; color: var(--text-secondary); text-align: center; font-size: 12px; line-height: 21.84px; }
.retry-action { width: 114.4px; margin: 14.56px auto 0; padding: 6.24px; min-height:44px; background: #fff; font-size: 12px;  }

.share-sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 8.32px 16.64px 18.72px; padding-bottom: calc(18.72px + env(safe-area-inset-bottom)); border-radius: 18.72px 18.72px 0 0; background: #fff; }
.share-sheet { max-height: calc(100vh - 24.96px); overflow-y: auto; box-sizing: border-box; }

.share-preview { display: flex; align-items: center; gap: 9.36px; margin-top: 6.24px; padding: 11.44px; border: 0.52px solid var(--border); border-radius: 10.4px; background: linear-gradient(135deg,#eaf4ff,#f2edff); }
.preview-mark { display: flex; align-items: center; justify-content: center; flex: none; width: 39.52px; height: 39.52px; border-radius: 10.4px; color: #fff; background: var(--brand); font-size: 18px; font-weight: 600; }
.preview-copy { flex: 1; min-width: 0; }
.preview-name { font-size: 14px; font-weight: 600; line-height: 20.8px; overflow-wrap: anywhere; word-break: break-all; }

.share-choice { position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; min-height:44px; margin-top: 10.4px; padding: 12.48px;  text-align: left; font-size: 14px; font-weight: 500; line-height: 20.8px; }
.friend-choice { color: #fff; background: var(--brand); }
.timeline-choice { margin-top: 7.28px; color: var(--text); background: var(--page-bg); }
.choice-arrow { font-size: 20px; font-weight: 400; }
.share-foot { margin-top: 12.48px; color: var(--text-secondary); text-align: center; font-size: 12px; line-height: 18.72px; }
.timeline-mask { z-index: 21; }
.timeline-guide { position: absolute; right: 14.56px; top: 23.92px; left: 39.52px; max-width: 301.6px; padding: 16.64px;  background: #fff; }
.timeline-guide { max-height: calc(100vh - 52px); overflow-y: auto; box-sizing: border-box;  }
.guide-pointer { position: absolute; top: -7.28px; right: 36.4px; width: 15.6px; height: 15.6px; border-radius: 2.08px; background: #fff; transform: rotate(45deg); }
.guide-menu { display: flex; align-items: center; justify-content: center; width: 39.52px; height: 22.88px; border: 1.04px solid var(--border); border-radius:16.64px; font-size: 20px; font-weight: 700; line-height: 1; }
.guide-title { margin-top: 12.48px; font-size: 18px; font-weight: 600; line-height: 24.96px; }

  .club-owner, .card-tagline, .benefit-title, .status-copy { font-size: 13px; line-height: 1.6; }

}

/* Match the club workspace button baseline on every public sharing surface. */

.intro-page button::after { border:0; }
.intro-page .sheet-close { min-height:44px; }
.intro-page .share-choice { justify-content:space-between;  }
.intro-page .guide-dismiss { width:100%; padding:10.4px;  }
.intro-page .verified-mark { justify-content:flex-start; min-height:44px; padding:6.24px 0; color:var(--text-secondary); background:transparent; font-size: 12px; }
.join-identity { margin-top:11.44px; padding:10.4px; border:0.52px solid var(--border);  color:var(--text-secondary); background: var(--sky-soft); font-size: 12px; line-height:1.8; overflow-wrap:anywhere; }
.intro-page .report-link { width:100%; min-height:44px; margin-top:6.24px; padding:10.4px 0; color:var(--text-secondary); background:transparent; font-size: 12px; }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-club-intro-club-intro .intro-card, .mini-club-intro-club-intro .intro-benefits, .mini-club-intro-club-intro .status, .mini-club-intro-club-intro .timeline-guide { border-radius: 18.72px; }
.mini-club-intro-club-intro .action, .mini-club-intro-club-intro .share-action, .mini-club-intro-club-intro .retry-action, .mini-club-intro-club-intro .share-choice, .mini-club-intro-club-intro .guide-dismiss { border-radius: 12.48px; }
.mini-club-intro-club-intro .join-identity { border-radius: 7.28px; }

/* Page composition and interaction hierarchy. */
.mini-club-intro-club-intro { color: var(--text); }
.mini-club-intro-club-intro button { font-weight: 500; border-radius: 12.48px; }

.intro-page { color: var(--text); background: transparent; }
.intro-card { border: 1px solid var(--border); background: linear-gradient(135deg,#eaf4ff,#ffffff); border-color: #dceaf3; box-shadow: var(--card-shadow); }
.intro-benefits { border: 1px solid var(--border); background: #ffffff; }
.status { border: 1px solid var(--border); background: var(--mint-soft); }
.club-name { font-size: 26px; font-weight: 600; }
.card-tagline,.benefit-copy { font-size: 14px; line-height: 1.8; }
.benefit-title { font-size: 15px; font-weight: 600; }
.intro-dock button,.share-sheet button { border-radius: 12.48px; font-size: 12px; }
.intro-dock .action { background: var(--brand); color: #fff; }
.intro-dock .share-action { border: 1px solid var(--border); background: #fff; color: var(--text); }
.share-choice { border: 1px solid var(--border); border-radius: 12.48px; background: #fff; }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
