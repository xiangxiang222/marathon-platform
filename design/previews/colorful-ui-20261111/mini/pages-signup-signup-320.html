<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#e1251b}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f6f8;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #737373;
  --border: #eaedf1;
  --sky: #2767aa;
  --sky-soft: #eaf4ff;
  --mint: #23765f;
  --mint-soft: #e9f7f2;
  --lilac: #7753ae;
  --lilac-soft: #f2edff;
  --sun: #986614;
  --sun-soft: #fff4d7;
  --peach-soft: #fff0e7;
  --card-shadow: 0 1.7066666666666668px 10.24px rgba(42, 61, 105, .025);
  --action-fill: linear-gradient(120deg, #e1251b, #cf3025);
  --control-radius: 10.24px;
  --card-radius: 15.36px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.4266666666666667px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.4266666666666667px solid var(--border);
  border-radius: 8.533333333333333px;
  background: #f8faff;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 10.24px; }
textarea { min-height: 120px; padding: 10.24px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 13.653333333333334px 13.653333333333334px calc(20.48px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.24px;
  padding: 13.653333333333334px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.128px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 10.24px; margin-top: 5.12px; padding: 7.68px 8.533333333333333px; border-radius: 6.826666666666667px; background: #f0f5fc; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 10.24px; padding: 8.533333333333333px 0; border-bottom: 0.4266666666666667px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 5.12px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 5.12px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 23.893333333333334px 13.653333333333334px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 6.826666666666667px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 10.24px; border-radius: 8.533333333333333px; background: #f8faff; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.4266666666666667px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: 0 2.56px 8.533333333333333px rgba(225, 37, 27, .14);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 10.24px; }
button.ghost {
  min-height: 44px;
  margin: 6.826666666666667px 6.826666666666667px 0 0;
  padding: 10px 16px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #f4bdb8; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 3.4133333333333336px; padding: 1.7066666666666668px 5.12px; border: 0.4266666666666667px solid #ebebed; border-radius: 5.12px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 8.533333333333333px; margin-top: 6.826666666666667px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 5.12px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 8.533333333333333px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 10.24px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 5.12px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky { background: linear-gradient(135deg, #f8fcff, var(--sky-soft)); border-color: #d9e9fb; }
.surface-mint { background: linear-gradient(135deg, #fbfffd, var(--mint-soft)); border-color: #d5eee4; }
.surface-lilac { background: linear-gradient(135deg, #fdfbff, var(--lilac-soft)); border-color: #e4d9f7; }
.surface-sun { background: linear-gradient(135deg, #fffdf7, var(--sun-soft)); border-color: #f3e4b8; }
.surface-peach { background: linear-gradient(135deg, #fffaf7, var(--peach-soft)); border-color: #f6dcd0; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: transparent; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 13.653333333333334px; box-sizing: border-box; }
.header-title { min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.21333333333333335px; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 13.653333333333334px 10.24px; color: #737373; font-size: 12px; line-height: 1.7; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.signup-page { box-sizing: border-box; min-height: 100vh; padding: 0 10.24px 76.8px; background: transparent; }
.signup-hero { position: relative; overflow: hidden; color: var(--text); background: linear-gradient(135deg,#fff0e7,#ffffff); border-color: #f3dfcf; box-shadow: var(--card-shadow); }
.signup-hero::before { position: absolute; top: 0; right: 0; width: 5.12px; height: 100%; background: var(--brand); content: "";  }
.hero-label { color: var(--brand); font-size: 12px; font-weight: 700; }
.signup-title { margin-top: 7.68px; overflow-wrap: anywhere; }
.signup-time { margin-top: 10.24px; font-size: 14px; line-height: 1.45; }
.signup-place { margin-top: 3.4133333333333336px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.signup-by { margin-top: 9.386666666666667px; padding-top: 6.826666666666667px; border-top: 0.4266666666666667px solid var(--border); color: var(--text-secondary); font-size: 12px; }
.selection-section { margin-top: 11.946666666666667px; }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 6.826666666666667px; margin: 0 0.8533333333333334px 5.973333333333334px; }
.section-title { font-size: 18px; line-height: 1.4; font-weight: 650; }
.required-mark { color: var(--brand); font-size: 12px; }
.group-options { display: flex; flex-direction: column; gap: 4.266666666666667px; }
.group-option { display: flex; align-items: center; justify-content: space-between; gap: 6.826666666666667px; min-height: 42.666666666666664px; box-sizing: border-box; background: #ffffff; }
.group-option-full { opacity: .55; }
.group-option-main { flex: 1; min-width: 0; }
.group-option-name { line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.group-option-pace { margin-left: 4.266666666666667px; color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.group-option-sub { margin-top: 2.1333333333333333px; color: var(--text-secondary); font-size: 12px; line-height: 1.35; }
.group-state { flex: none; min-width: 25.6px; text-align: right; }
.group-option-on .group-state { color: var(--brand); font-weight: 600; }
.group-option-full .group-state { color: var(--text-secondary); }
.no-groups { padding: 11.093333333333334px 8.533333333333333px;  background: #fff; color: var(--text-secondary); font-size: 12px; }
.signup-deadline { margin: 5.973333333333334px 1.7066666666666668px 0; color: var(--brand); font-size: 12px; line-height: 1.45; }
.optional-section { margin-top: 11.946666666666667px;  background: #ffffff; }
.optional-toggle { display: flex; justify-content: space-between; gap: 6.826666666666667px; min-height:44px; }
.optional-title { font-weight: 600; }
.optional-caption { margin-left: 4.266666666666667px; color: var(--text-secondary); }
.optional-arrow { flex: none; color: var(--brand); font-size: 12px; }
.optional-fields { padding: 0 8.533333333333333px 9.386666666666667px; }
.field-label { margin: 1.7066666666666668px 0 4.266666666666667px; color: var(--text-secondary); font-size: 12px; }
.choice-row { display: flex; gap: 4.266666666666667px; }
.choice { flex: 1; min-width: 0; min-height: 44px; height: 44px; color: var(--text-secondary); text-align: center; }
.choice-on { font-weight: 600; }
.level-label { margin-top: 9.386666666666667px; }
.level-list { overflow: hidden; border-radius: 3.4133333333333336px; background: var(--lilac-soft); }
.level-option { display: flex; align-items: center; gap: 5.12px; min-height:44px; padding: 5.12px 5.973333333333334px; border-bottom: 0.4266666666666667px solid var(--border); }
.level-option:last-child { border-bottom: 0; }
.level-name { flex: none; width: 30.72px; font-size: 12px; font-weight: 600; }
.level-description { flex: 1; min-width: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
.level-check { flex: none; width: 22.186666666666667px; color: var(--brand); font-size: 12px; text-align: right; }
.error-line { margin-top: 6.826666666666667px; color: var(--brand); font-size: 12px; line-height: 1.5; }
.action-hint { margin-top: 6.826666666666667px; color: var(--text-secondary); font-size: 12px; }
.bottom-space { height: 8.533333333333333px; }
.submit-bar { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 7.68px; box-sizing: border-box; min-height: 49.49333333333333px; padding: 6.826666666666667px 10.24px; padding-bottom: calc(6.826666666666667px + env(safe-area-inset-bottom)); border-top: 0.4266666666666667px solid var(--border); background: rgba(255,255,255,.98); }
.submit-count { display: flex; align-items: baseline; gap: 2.56px; flex: 1; min-width: 0; }
.count-number { font-size: 18px; font-weight: 700; }
.count-label { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.submit-button { flex: none; width: 153.6px; height: 34.986666666666665px; min-height:44px; margin: 0; padding: 0 6.826666666666667px;  background: var(--brand); color: #fff; font-size: 12px; line-height: 34.986666666666665px; }
.submit-button[disabled] { background: var(--border); color: var(--text-secondary);  }
.load-state { display: flex; align-items: center; flex-direction: column; justify-content: center; min-height: 70vh; padding: 17.066666666666666px; color: var(--text-secondary); font-size: 12px; text-align: center; }
.load-mark { display: flex; align-items: center; justify-content: center; width: 39.25333333333333px; height: 39.25333333333333px; margin-bottom: 8.533333333333333px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; }
.retry-button { min-height:44px; margin-top: 10.24px; padding: 0 11.946666666666667px;  background: var(--brand); color: #fff; font-size: 12px; line-height: 30.72px; }

@media (max-width: 350px) {
  .signup-title { font-size: 24px; }
  .submit-bar { gap: 4.266666666666667px; padding-right: 10.24px; padding-left: 10.24px; }
  .submit-button { width: 128px; font-size: 12px;  }
  .level-option { gap: 3.4133333333333336px; padding-right: 4.266666666666667px; padding-left: 4.266666666666667px; }
  .level-description { font-size: 12px; }
}

/* Use layout centering instead of inherited native button line heights. */
.signup-page button { display: flex; align-items: center; justify-content: center; line-height: 1.35; box-sizing: border-box; }

.signup-hero { margin: 10.24px 0 0; background: linear-gradient(135deg,#fff0e7,#ffffff); border-color: #f3dfcf; box-shadow: var(--card-shadow); }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-signup-signup .signup-hero, .mini-signup-signup .group-option, .mini-signup-signup .optional-section, .mini-signup-signup .no-groups { border-radius: 15.36px; }
.mini-signup-signup .submit-button, .mini-signup-signup .retry-button { border-radius: 10.24px; }
.mini-signup-signup .choice { border-radius: 5.973333333333334px; }

/* Page composition and interaction hierarchy. */
.mini-signup-signup { color: var(--text); }
.mini-signup-signup button { font-weight: 500; border-radius: 10.24px; }

.signup-page { background: transparent; color: var(--text); }
.signup-hero { padding: 12.8px; border: 1px solid var(--border); background: linear-gradient(135deg,#fff0e7,#ffffff); border-color: #f3dfcf; box-shadow: var(--card-shadow); }
.signup-title { font-size: 24px; font-weight: 600; line-height: 1.45; }
.hero-label,.signup-by,.group-option-sub { font-size: 11px; }
.signup-time,.signup-place { font-size: 13px; }
.group-option { padding: 11.946666666666667px; border: 1px solid var(--border); background: #ffffff; }
.group-option-on { border-color: var(--brand); background: linear-gradient(120deg,#ffe8df,#fff4e9); }
.group-option-name { font-size: 15px; }
.group-state { color: var(--brand); font-size: 12px; }
.optional-section { border: 1px solid var(--border); background: #ffffff; }
.optional-toggle { align-items: flex-start; padding: 10.24px; }
.optional-title { display: block; font-size: 13px; }
.optional-caption { display: block; margin: 3.4133333333333336px 0 0; font-size: 12px; line-height: 1.7; }
.choice { display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 5.973333333333334px; background: #fff; font-size: 12px; line-height: 1.4; }
.choice-on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.submit-bar .submit-button { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10.24px; line-height: 1.4; background: var(--brand); }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-signup-signup .submit-button { font-size: 14px; font-weight: 500; }
.mini-signup-signup .retry-button { font-size: 13px; font-weight: 500; }
.submit-bar .submit-button { font-size: 14px; }
</style></head><body><div class="signup-page mini-signup-signup">
  <div class="signup-hero">

    <div class="group-options">
      <div class="group-option group-option-on ">

        <div class="group-state">已选</div>
      </div><div class="group-option  ">

        <div class="group-state">选择</div>
      </div>
    </div>
    
    
  </div>

  <div class="optional-section">

  <div class="bottom-space"></div>

    <button class="submit-button" loading="false">确认报名</button>
  </div>
</div>
