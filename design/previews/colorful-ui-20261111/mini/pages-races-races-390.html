<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#e1251b}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f6f8;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #737373;
  --border: #eaedf1;
  --sky: #2767aa;
  --sky-soft: #eaf4ff;
  --mint: #23765f;
  --mint-soft: #e9f7f2;
  --lilac: #7753ae;
  --lilac-soft: #f2edff;
  --sun: #986614;
  --sun-soft: #fff4d7;
  --peach-soft: #fff0e7;
  --card-shadow: 0 2.08px 12.48px rgba(42, 61, 105, .025);
  --action-fill: linear-gradient(120deg, #e1251b, #cf3025);
  --control-radius: 12.48px;
  --card-radius: 18.72px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.52px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.52px solid var(--border);
  border-radius: 10.4px;
  background: #f8faff;
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 12.48px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 16.64px 16.64px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 12.48px;
  padding: 16.64px;
  border: 0.52px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.156px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 12.48px; margin-top: 6.24px; padding: 9.36px 10.4px; border-radius: 8.32px; background: #f0f5fc; font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 12.48px; padding: 10.4px 0; border-bottom: 0.52px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 6.24px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 6.24px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 29.12px 16.64px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 8.32px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 12.48px; border-radius: 10.4px; background: #f8faff; }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.52px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: 0 3.12px 10.4px rgba(225, 37, 27, .14);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 12.48px; }
button.ghost {
  min-height: 44px;
  margin: 8.32px 8.32px 0 0;
  padding: 10px 16px;
  border: 0.52px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: #f4bdb8; background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky { background: linear-gradient(135deg, #f8fcff, var(--sky-soft)); border-color: #d9e9fb; }
.surface-mint { background: linear-gradient(135deg, #fbfffd, var(--mint-soft)); border-color: #d5eee4; }
.surface-lilac { background: linear-gradient(135deg, #fdfbff, var(--lilac-soft)); border-color: #e4d9f7; }
.surface-sun { background: linear-gradient(135deg, #fffdf7, var(--sun-soft)); border-color: #f3e4b8; }
.surface-peach { background: linear-gradient(135deg, #fffaf7, var(--peach-soft)); border-color: #f6dcd0; }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: transparent; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }
.header-title { min-width: 0; overflow: hidden; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.26px; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 16.64px 12.48px; color: #737373; font-size: 12px; line-height: 1.7; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.page { min-height: 100vh; background: transparent; color: var(--text); font-weight: 400; }
.home-navigation { position: sticky; top: 0; z-index: 12; background: linear-gradient(110deg,#fff7f1,#ffffff); }
.home-header { padding-bottom: 6.24px; background: linear-gradient(145deg,#fff0e7 0%,#fff8f3 34%,#ffffff 100%); }
.home-nav { display: flex; align-items: center; gap: 8.32px; padding-left: 12.48px; box-sizing: border-box; overflow: hidden; }
.home-title { flex: none; font-size: 26px; font-weight: 700; line-height: 1.2; }
.intro-title { font-size: 24px; line-height: 1.4; font-weight: 750; letter-spacing: -.5px; }
.intro-caption { margin-top: 5.2px; color: var(--text-secondary); font-size: 12px; line-height: 1.7; }
.today { min-width: 0; overflow: hidden; color: var(--text-secondary); font-size: 12px; line-height: 16.64px; text-overflow: ellipsis; white-space: nowrap; }

.search { display: flex; align-items: center; height: 52px; margin: 10.4px 12.48px 0; padding: 4px 5px 4px 11.44px;  box-sizing: border-box; background: #fff; }
.lens { position: relative; flex: none; width: 11.44px; height: 11.44px; border: 1.04px solid var(--text-secondary); border-radius: 50%; }
.lens::after { position: absolute; right: -4.16px; bottom: -1.56px; width: 5.2px; height: 1.04px; background: var(--text-secondary); transform: rotate(45deg); content: ''; }
.search-input { flex: 1; min-width: 0; min-height: 44px; height: 44px; margin-left: 8.32px; padding: 0; border: 0; border-radius: 0; background: transparent; font-size: 14px; }
.search-placeholder { color: var(--text-secondary); font-size: 14px; }
.find { flex: none; padding-left: 10.4px; color: #fff; line-height: 44px;  min-height: 44px; height: 44px; padding: 0 12.48px; background: var(--brand); }

.kind-tabs { display: flex; gap: 20.8px; width: 100%; height: 49.92px; padding: 0 16.64px; box-sizing: border-box; }
.kind-tab { min-height: 44px; position: relative; display: flex; flex: none; min-width: 0; align-items: center; justify-content: center; height: 49.92px; color: var(--text-secondary); font-size: 16px; font-weight: 500; white-space: nowrap;  }
.kind-tab.on { font-size: 18px;  }
.kind-tab.on::after { position: absolute; bottom: 6.24px; left: 50%; width: 20.8px;  background: var(--brand); transform: translateX(-50%); content: ''; }
.quick-entries { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 4.16px 12.48px 0; padding: 14.56px 0 10.4px;  background: #ffffff; border-color: #dfebfa; box-shadow: var(--card-shadow); }
.quick-entry { display: flex; min-width: 0; min-height: 60.32px; flex-direction: column; align-items: center; gap: 7.28px; color: var(--text-secondary); font-size: 12px; line-height: 20.8px; white-space: nowrap; }
.quick-icon { display: block; width: 33.28px; height: 33.28px; margin: 0; border: 0; background: transparent; }

.reminder { height: 52px; margin: 10.4px 12.48px; overflow: hidden;  background: linear-gradient(100deg,#fff0e7,#fff4d7); }
.reminder-swiper { width: 100%; height: 52px; }
.reminder-item { display: flex; align-items: center; gap: 8.32px; height: 52px; padding: 8.32px 10.4px; box-sizing: border-box; }
.reminder-clock { position: relative; flex: none; width: 17.68px; height: 17.68px; border: 1.04px solid var(--brand); border-radius: 50%; box-sizing: border-box; }
.reminder-clock::before { position: absolute; top: 3.12px; left: 7.28px; width: 1.04px; height: 5.2px; border-radius: 0.52px; background: var(--brand); content: ''; }
.reminder-clock::after { position: absolute; top: 7.28px; left: 7.28px; width: 4.68px; height: 1.04px; border-radius: 0.52px; background: var(--brand); content: ''; }
.reminder-copy { flex: 1; min-width: 0; }
.reminder-reason { overflow: hidden; color: var(--brand); font-size: 12px; line-height: 13.52px; text-overflow: ellipsis; white-space: nowrap; }
.reminder-name { margin-top: 2.08px; overflow: hidden; color: var(--text); font-size: 12px; line-height: 16.64px; text-overflow: ellipsis; white-space: nowrap; }
.reminder-arrow { flex: none; color: var(--brand); font-size: 18px; line-height: 1; }

.results { padding: 6.24px 0 12.48px; }
.results-head { display: flex; align-items: center; justify-content: space-between; gap: 8.32px; margin: 0 12.48px 6.24px; }
.results-title { color: var(--text); font-size: 19px; font-weight: 700; line-height: 26px; }
.total { flex: none; color: var(--text-secondary); font-size: 12px; line-height: 17.68px; }
.race-format-filter { display: flex; align-items: center; gap: 12.48px; margin: 0 12.48px 12.48px; }
.format-label { flex: none; color: var(--text-secondary); font-size: 12px; line-height: 20.8px; }
.meet-tabs { display: flex; flex: 1; min-width: 0; max-width: 291.2px; }
.meet-tabs .kind-tab { flex: 1; height: 44px; min-height: 44px; padding: 0 4.16px;  color: var(--text-secondary); line-height: 20.8px; font-weight: 400; box-sizing: border-box; }
.meet-tabs .kind-tab.on { font-size: 12px; font-weight: 600;  }
.meet-tabs .kind-tab.on::after { display: none;  }
.filters { width: 100%; height: 56px; overflow: hidden; white-space: nowrap; }
.filter-chip { display: inline-block; height: 40px; margin-right: 6.24px; padding: 0 10.4px;  background: #fff; color: var(--text); font-size: 12px; line-height: 40px; vertical-align: top;  min-height: 40px; border: 0.52px solid var(--border);}
.filter-chip:first-child { margin-left: 12.48px;  }
.filter-chip:last-child { margin-right: 12.48px;  }
.filter-chip.on { background: #fff0e7; color: var(--brand);  }
.race { display: flex; align-items: flex-start; gap: 10.4px; margin: 0 12.48px 10.4px; padding: 14.56px;  background: #ffffff;  border: 0.52px solid #fff; box-shadow: var(--card-shadow); }
.date { display: flex; flex: none; width: 54.08px; height: 64.48px; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(145deg,#fff0e7,#fff4d7); }
.mo { color: var(--text-secondary); font-size: 12px; line-height: 14.56px; }
.da { margin-top: 2.08px; font-size: 27.04px; font-weight: 700; line-height: 31.2px; }
.race-body { flex: 1; min-width: 0; }
.race-name { display: -webkit-box; overflow: hidden; color: var(--text); line-height: 1.5; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.race-meta { margin-top: 4.16px; overflow: hidden; color: var(--text-secondary); font-size: 12px; line-height: 1.7; text-overflow: ellipsis; white-space: nowrap; }
.race-footer { display: flex; align-items: center; gap: 6.24px; margin-top: 7.28px;  flex-wrap: wrap;}
.status-pill { flex: none; padding: 1.04px 5.2px;  background: var(--brand-soft); color: var(--brand); font-size: 12px; line-height: 14.56px; white-space: nowrap; }
.status-pill.muted-status { background: var(--sky-soft); color: var(--text-secondary);  }
.deadline { flex: 1; min-width: 0; overflow: hidden; color: var(--text-secondary); font-size: 12px; line-height: 15.6px; text-overflow: ellipsis; white-space: nowrap; }
.deadline.hot { color: var(--brand); }
.page-error { margin: 8.32px 12.48px; color: var(--brand); font-size: 12px; }
.page-error .retry { margin-left: 8.32px; color: var(--brand); font-weight: 600; }
.empty { padding: 24.96px 12.48px; color: var(--text-secondary); font-size: 14px; text-align: center; }
.pager { display: flex; align-items: center; flex-wrap: wrap; gap: 6.24px; margin: 10.4px 12.48px 4.16px; }
.pager-step { height: 33.28px; padding: 0 4.16px; color: var(--brand); font-size: 12px; font-weight: 600; line-height: 33.28px; }
.pager-step.off { color: #c9ccd3; }
.pager-num { min-width: 24.96px; height: 33.28px; padding: 0 8.32px; border-radius: 8.32px; background: var(--page-bg); color: var(--text); font-size: 12px; font-weight: 600; line-height: 33.28px; text-align: center; }
.pager-num.on { background: var(--brand); color: #fff; }

.dim { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); }
.drop { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 70vh; padding-bottom: env(safe-area-inset-bottom); border-radius: 12.48px 12.48px 0 0; background: #fff; }
.loc { display: flex; height: 353.6px; }
.prov { flex: none; width: 116.48px; height: 353.6px; background: var(--page-bg); }
.prov-item { padding: 14.56px 16.64px; color: var(--text); font-size: 14px; }
.prov-item.on { background: #fff; color: var(--brand); font-weight: 600; }
.cities, .months { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8.32px; }
.cities { flex: 1; min-width: 0; padding: 12.48px; box-sizing: border-box; }
.time { max-height: 70vh; padding: 12.48px 14.56px 16.64px; box-sizing: border-box; }
.year { margin: 10.4px 0 8.32px; font-size: 14px; font-weight: 600; }
.pick { padding: 8.32px 12.48px;  background: var(--page-bg); color: var(--text); font-size: 12px; }
.pick.on { background: var(--brand); color: #fff;  }

.sheet-title { margin-bottom: 12.48px; font-size: 18px; font-weight: 600; }
.actions { display: flex; gap: 10.4px; margin-top: 16.64px; }
.act { flex: 1; height: 45.76px;  font-size: 14px; font-weight: 600; line-height: 45.76px; text-align: center; }

@media (max-width: 350px) {

  .today { font-size: 11px; }
  .kind-tabs { gap: 20.8px; padding-left: 12.48px;  height: 49.92px;}
  .kind-tab { min-height: 44px; font-size: 16px;  height: 49.92px;  }
  .kind-tab.on { font-size: 18px;  }

  .quick-icon { width: 30px; height: 30px; }
  .race-format-filter { gap: 10px; }
  .format-label { font-size: 12px; }
  .meet-tabs .kind-tab, .meet-tabs .kind-tab.on { font-size: 12px;  }
  .race-name { font-size: 18px; line-height: 1.5;  font-weight: 650;}
  .race-meta { font-size: 12px; line-height: 1.7;  margin-top: 4.16px;}
  .status-pill, .deadline { font-size: 11px; line-height: 16px;  }
  .race-footer { flex-wrap: wrap;  margin-top: 7.28px;}

  .mo { font-size: 11px; line-height: 16px; }
  .da { font-size: 26px; line-height: 28px; }
}

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-races-races .race, .mini-races-races .quick-entries, .mini-races-races .reminder { border-radius: 18.72px; }
.mini-races-races .search, .mini-races-races .find, .mini-races-races .filter-chip, .mini-races-races .pick, .mini-races-races .act { border-radius: 12.48px; }
.mini-races-races .status-pill, .mini-races-races .kind-tab { border-radius: 7.28px; }

/* Page composition and interaction hierarchy. */
.mini-races-races { color: var(--text); }
.mini-races-races button { font-weight: 500; border-radius: 12.48px; }

.home-title,.intro-title { font-weight: 600; }
.home-intro { padding: 16.64px 14.56px 0; }
.search { border: 1px solid var(--border); border-radius: 12.48px; }
.find { border-radius: 12.48px; font-size: 12px; font-weight: 500; }
.kind-tab,.kind-tab.on { font-size: 14px; font-weight: 500; border-radius: 0; }
.kind-tab.on { color: var(--text); font-weight: 600; }
.kind-tab.on::after { height: 2px; border-radius: 0; }
.meet-tabs { gap: 6.24px; padding: 0; border-radius: 0; background: transparent; }
.meet-tabs .kind-tab { border: 1px solid var(--border); border-radius: 7.28px; background: #fff; font-size: 12px; }
.meet-tabs .kind-tab.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); box-shadow: none; }
.filter-chip { border-radius: 7.28px; }
.filter-chip.on { border-color: var(--brand); background: #fff0e7; }
.race { border: 1px solid var(--border); box-shadow: var(--card-shadow); background: #ffffff; }
.quick-entries { border: 1px solid var(--border); background: #ffffff; border-color: #dfebfa; box-shadow: var(--card-shadow); }
.race-name { font-size: 18px; font-weight: 600; }
.race-meta,.deadline,.status-pill { font-size: 11px; }
.date { border-radius: 12.48px; background: linear-gradient(145deg,#fff0e7,#fff4d7); }
.da { color: var(--text); }

/* Primary actions read at 14px, secondary actions at 13px; compact filters stay at 12px. */
.mini-races-races .find { font-size: 14px; font-weight: 500; }
</style></head><body><div class="page mini-races-races">
  <div class="home-navigation">

    <div class="home-nav" style="height: 44px; padding-right: 104px;">
      <span class="home-title">赛历</span>
      <span class="today">11月5日 周四</span>
    </div>
  </div>
  <div class="home-header">
