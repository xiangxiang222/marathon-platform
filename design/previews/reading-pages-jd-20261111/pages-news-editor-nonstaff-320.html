  --brand: #ff1838;
  --brand-soft: #fff0f2;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --brand-header: linear-gradient(145deg, #ff1838 0%, #ff2946 60%, #ff4659 100%);
  --text: #1a1a1a;
  --text-secondary: #777777;
  --border: #eeeeee;
  --sky: #555555;
  --sky-soft: #f7f7f7;
  --mint: #555555;
  --mint-soft: #f7f7f7;
  --lilac: #555555;
  --lilac-soft: #f7f7f7;
  --sun: #555555;
  --sun-soft: #f7f7f7;
  --peach-soft: #fff0f2;
  --card-shadow: none;
  --action-fill: #ff1838;
  --control-radius: 8.533333333333333px;
  --card-radius: 10.24px;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }
button, input, textarea { font-family: inherit; color: var(--text); }
button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 12px 18px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
button::after { border: 0; }
button[plain] { border: 0.4266666666666667px solid var(--border); background: var(--surface); }
input, textarea {
  min-width: 0;
  border: 0.4266666666666667px solid var(--border);
  border-radius: 8.533333333333333px;
  background: var(--page-bg);
  color: var(--text);
  font-size: 14px;
  caret-color: var(--brand);
}
input { min-height: 46px; padding: 0 10.24px; }
textarea { min-height: 120px; padding: 10.24px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #999999; }
.pad { padding: 13.653333333333334px 13.653333333333334px calc(20.48px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.24px;
  padding: 13.653333333333334px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
}
.title { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: normal; }
.muted { color: var(--text-secondary); font-size: 12px; }
.slot { display: flex; justify-content: space-between; gap: 10.24px; margin-top: 5.12px; padding: 7.68px 8.533333333333333px; border-radius: 6.826666666666667px; background: var(--page-bg); font-size: 14px; }
.slot-state { color: var(--text-secondary); font-size: 12px; }
.teal { color: var(--brand); }
.row { display: flex; justify-content: space-between; gap: 10.24px; padding: 8.533333333333333px 0; border-bottom: 0.4266666666666667px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row .k { flex: none; color: var(--text-secondary); }
.soon { color: #c87825; }
.err { margin-top: 5.12px; color: #b42318; font-size: 12px; line-height: 1.7; }
.note { margin-top: 5.12px; color: var(--brand); font-size: 12px; line-height: 1.7; }
.empty { padding: 23.893333333333334px 13.653333333333334px; color: var(--text-secondary); font-size: 13px; text-align: center; line-height: 1.8; }
.field { display: flex; align-items: center; gap: 6.826666666666667px; }
.field input { flex: 1; min-width: 0; height: 46px; padding: 0 10.24px; border-radius: 8.533333333333333px; background: var(--page-bg); }
.btn, .login-go {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  margin: 0;
  padding: 12px 20px;
  border: 0.4266666666666667px solid transparent;
  border-radius: var(--control-radius);
  background: var(--action-fill);
  box-shadow: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.login-go { margin-top: 10.24px; }
button.ghost {
  min-height: 44px;
  margin: 6.826666666666667px 6.826666666666667px 0 0;
  padding: 10px 16px;
  border: 0.4266666666666667px solid var(--border);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
button.ghost.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
button[disabled], button.btn[disabled] { border-color: #eeeeef; background: #f2f2f2; color: #999999; opacity: 1; box-shadow: none; }
.chip { display: inline-block; margin-right: 3.4133333333333336px; padding: 1.7066666666666668px 5.12px; border: 0.4266666666666667px solid #ebebed; border-radius: 5.12px; background: #f5f5f7; color: var(--text-secondary); font-size: 12px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 8.533333333333333px; margin-top: 6.826666666666667px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 5.12px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 8.533333333333333px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 10.24px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }

.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 5.12px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky, .surface-mint, .surface-lilac, .surface-sun, .surface-peach { background: var(--surface); border-color: var(--border); }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { position: relative; padding-bottom: 17.066666666666666px; background: var(--brand-header); color: #fff; }

.header-actions { position: relative; color: #fff; }
