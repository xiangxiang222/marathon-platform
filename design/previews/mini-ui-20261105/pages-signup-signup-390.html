<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {

}

.signup-page { box-sizing: border-box; min-height: 100vh; padding: 0 12.48px 93.6px; color: #262626; }

.group-options { display: flex; flex-direction: column; gap: 5.2px; }

.group-option-name { font-size: 14px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }

.no-groups { padding: 13.52px 10.4px; border-radius: 6.24px; background: #fff; color: #767676; font-size: 12px; }
.signup-deadline { margin: 7.28px 2.08px 0; color: #c87825; font-size: 12px; line-height: 1.45; }
.optional-section { margin-top: 14.56px; border-radius: 6.24px; background: #fff; }
.optional-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8.32px; min-height:44px; padding: 0 10.4px; }
.optional-title { font-size: 12px; font-weight: 600; }
.optional-caption { margin-left: 5.2px; color: #767676; font-size: 12px; }
.optional-arrow { flex: none; color: #e1251b; font-size: 12px; }

.field-label { margin: 2.08px 0 5.2px; color: #767676; font-size: 12px; }

.choice-on { background: #fff2f0; color: #e1251b; font-weight: 600; }
.level-label { margin-top: 11.44px; }

.level-option:last-child { border-bottom: 0; }
.level-name { flex: none; width: 37.44px; font-size: 12px; font-weight: 600; }
.level-description { flex: 1; min-width: 0; color: #767676; font-size: 12px; line-height: 1.4; }
.level-check { flex: none; width: 27.04px; color: #e1251b; font-size: 12px; text-align: right; }
.error-line { margin-top: 8.32px; color: #b42318; font-size: 12px; line-height: 1.5; }
.action-hint { margin-top: 8.32px; color: #767676; font-size: 12px; }
.bottom-space { height: 10.4px; }
.submit-bar { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 9.36px; box-sizing: border-box; min-height: 60.32px; padding: 8.32px 12.48px calc(8.32px + constant(safe-area-inset-bottom)); padding-bottom: calc(8.32px + env(safe-area-inset-bottom)); border-top: 0.52px solid #e8e8e8; background: rgba(255,255,255,.98); }

.submit-button { flex: none; width: 187.2px; height: 42.64px; min-height:44px; margin: 0; padding: 0 8.32px; border-radius:519.48px; background: #e1251b; color: #fff; font-size: 12px; line-height: 42.64px; }

.load-mark { display: flex; align-items: center; justify-content: center; width: 47.84px; height: 47.84px; margin-bottom: 10.4px; border-radius: 50%; background: #262626; color: #e1251b; font-size: 12px; font-weight: 700; }
.retry-button { min-height:44px; margin-top: 12.48px; padding: 0 14.56px; border-radius: 5.2px; background: #e1251b; color: #fff; font-size: 12px; line-height: 37.44px; }

@media (max-width: 350px) {

/* Use layout centering instead of inherited native button line heights. */
.signup-page button { display: flex; align-items: center; justify-content: center; line-height: 1.35; box-sizing: border-box; }

.signup-hero { margin: 12.48px 0 0; border-radius:16.64px; }
</style></head><body><div class="signup-page">
