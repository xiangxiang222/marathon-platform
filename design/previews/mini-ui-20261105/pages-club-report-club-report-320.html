<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f5f5;

  --text: #262626;

  font-size: 14px;
  line-height: 1.6;
}

div, span, a, div, button, input, textarea, div {
  box-sizing: border-box;
}

button, input, textarea {
  font-family: inherit;
  color: #262626;
}

button {
  margin: 0;
  border: 0;
  min-height: 44px;
  border-radius: 426.24px;
  background: #f2f2f2;
  font-size: 14px;
}

input, textarea {
  box-sizing: border-box;
  border: 0.4266666666666667px solid #e8e8e8;
  border-radius: 8.533333333333333px;
  background: #f7f7f7;
  color: #262626;
  font-size: 14px;
}

button::after { border: 0; }
button[plain] { border: 0.4266666666666667px solid #e8e8e8; background: #fff; }
input { min-height: 44px; padding: 0 10.24px; }
textarea { min-height: 120px; padding: 9.386666666666667px 10.24px; line-height: 1.7; }

.pad { padding: 11.946666666666667px 10.24px calc(20.48px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 8.533333333333333px;
  padding: 12.8px;
  border: 0;
  border-radius:13.653333333333334px;
  background: #fff;
}
.muted { color: #767676; font-size: 12px; }
.slot {
  display: flex;
  justify-content: space-between;
  gap: 10.24px;
  margin-top: 5.12px;
  padding: 6.826666666666667px 8.533333333333333px;
  border-radius: 6.826666666666667px;
  background: #f5f5f5;
  font-size: 14px;
}
.slot-state { color: #767676; font-size: 12px; }
.teal { color: #e1251b; }
.title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 10.24px;
  padding: 6.826666666666667px 0;
  border-bottom: 0.4266666666666667px solid #eeeeee;
}
.row .k { flex: none; color: #767676; }
.soon { color: #c87825; }
.err { margin-top: 3.4133333333333336px; color: #b42318; font-size: 12px; }
.note { margin-top: 3.4133333333333336px; color: #e1251b; font-size: 12px; }
.empty { padding: 27.30666666666667px 13.653333333333334px; color: #767676; text-align: center; line-height: 1.8; }

.field { display: flex; align-items: center; gap: 6.826666666666667px; }
.field input {
  flex: 1;
  height: 44px;
  padding: 0 8.533333333333333px;
  border-radius: 8.533333333333333px;
  background: #fff;
}
.btn {
  display: block;
  margin: 0;
  padding: 0 11.946666666666667px;
  min-height: 44px;
  border-radius:426.24px;
  background: #e1251b;
  color: #fff;
  font-size: 14px;
  line-height: 44px;
  text-align: center;
}
button.ghost {
  margin: 6.826666666666667px 6.826666666666667px 0 0;
  padding: 0 10.24px;
  min-height: 44px;
  border-radius:426.24px;
  background: #f2f2f2;
  color: #262626;
  font-size: 12px;
  line-height: 44px;
}
button.ghost.on { background: #fff2f0; color: #e1251b; }
button[disabled], button.btn[disabled] { background: #f2f2f2; color: #767676; }
.chip {
  display: inline-block;
  margin-right: 3.4133333333333336px;
  padding: 0.8533333333333334px 4.266666666666667px;
  border-radius: 3.4133333333333336px;
  background: #f2f2f2;
  color: #767676;
  font-size: 12px;
}
.login-go {
  display: block;
  min-height: 44px;
  margin-top: 6.826666666666667px;
  border-radius: 426.24px;
  background: #e1251b;
  color: #fff;
  font-weight: 600;
  line-height: 44px;
  text-align: center;
}
.foot {
  display: flex;
  justify-content: space-between;
  margin-top: 5.12px;
  color: #767676;
  font-size: 12px;
}

/* Shared form language also covers the compact secondary pages. */
.src { margin-top: 5.12px; color: #767676; font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 8.533333333333333px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 10.24px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius:426.24px; }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
@media (max-width: 350px) {
  .pad { padding-left: 12px; padding-right: 12px; }

}

:host { display: block; }
.page-header { background: #f5f5f5; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 10.24px; box-sizing: border-box; }
.header-title { overflow: hidden; font-size: 24px; line-height: 1.25; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 10.24px 10.24px; color: #767676; font-size: 12px; line-height: 1.6; }
@media (max-width: 350px) { .header-title { font-size: 24px; } .header-subtitle { font-size: 12px; } }

.identity-page { min-height:100vh; padding:11.946666666666667px 10.24px 20.48px; box-sizing:border-box; color:#262626; background:#f5f5f5; }
.hero { padding:7.68px 3.4133333333333336px 12.8px; }
.eyebrow { color:#767676; font-size: 12px; letter-spacing:1.28px; }
.title { margin-top:6.826666666666667px; font-size: 22px; font-weight:700; }
.copy { margin-top:5.973333333333334px; color:#767676; font-size: 12px; line-height:1.8; overflow-wrap:anywhere; }
.panel { margin-bottom:8.533333333333333px; padding:11.946666666666667px; border-radius:13.653333333333334px; background:#fff; }
.name { font-size: 16px; font-weight:600; overflow-wrap:anywhere; }
.state { display:inline-block; margin-top:8.533333333333333px; padding:4.266666666666667px 6.826666666666667px; color:#767676; background:#f2f2f2; border-radius:4.266666666666667px; font-size: 12px; }
.decision { margin-top:8.533333333333333px; padding:8.533333333333333px; border-radius:5.973333333333334px; color:#767676; background:#fff8f7; font-size: 12px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
.label { display:flex; flex-wrap:wrap; gap:5.12px; margin:11.946666666666667px 0 5.12px; font-size: 14px; font-weight:600; }
.label span { color:#767676; font-size: 12px; font-weight:400; }
.identity-page input { width:100%; height:40.96px; padding:0 8.533333333333333px; font-size: 14px; }
.identity-page textarea { width:100%; min-height:106.66666666666667px; padding:8.533333333333333px; font-size: 14px; line-height:1.7; }
.identity-page button,.action-link { display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; padding:8.533333333333333px; box-sizing:border-box; border:0; border-radius:6.826666666666667px; font-size: 14px; line-height:1.5; }
.identity-page button::after { border:0; }
.primary { margin-top:11.946666666666667px; color:#fff; background:#e1251b; }
.secondary { color:#767676; background:#fff; }
.panel .secondary { margin-top:10.24px; background:#f2f2f2; }
.identity-page .short-intro { min-height:59.733333333333334px; }
.message { margin:8.533333333333333px 0; padding:10.24px; border-radius:6.826666666666667px; color:#b45369; background:#fff2f0; font-size: 12px; line-height:1.8; overflow-wrap:anywhere; }

@media (max-width:350px) { .identity-page button,.action-link { min-height:44px; } .identity-page input { min-height:44px; } }

.type-choices { display:flex; flex-direction:column; gap:5.12px; }
.identity-page .type-choice { justify-content:flex-start; min-height:44px; text-align:left; color:#767676; background:#f4f5f8; font-size: 12px; }
.identity-page .type-choice.selected { color:#ce2748; background:#fff2f0; box-shadow:inset 0 0 0 0.4266666666666667px #ffc5d0; }
.target-card { margin-top:10.24px; padding:10.24px; background:#f7f7f7; border-radius:6.826666666666667px; }
.list-heading,.report-heading { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6.826666666666667px; }
.identity-page .refresh { width:auto; min-width:47.78666666666667px; min-height:44px; padding:5.973333333333334px; color:#767676; background:transparent; font-size: 12px; }
.report-item { margin-top:8.533333333333333px; padding-top:10.24px; border-top:0.4266666666666667px solid #e8e8e8; }
.report-heading .state { margin:0; }
.report-detail { margin-top:5.973333333333334px; font-size: 12px; line-height:1.7; color:#767676; white-space:pre-wrap; overflow-wrap:anywhere; }
</style></head><body><div class="identity-page">
  <div class="hero"><div class="eyebrow">私人申诉</div><div class="title">名称与身份申诉</div><div class="copy">同名本身不等于冒用。请说明具体的误导呈现或管理授权问题，平台核对后处理；不会把成员、账目或历史记录移交给申诉方。</div></div>
