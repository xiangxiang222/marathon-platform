<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #767676;
  --border: #eeeeee;
  min-height: 100%;
  background: #f5f5f5;
  color: #262626;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

div, span, a, div, button, input, textarea, div {
  box-sizing: border-box;
}

button, input, textarea {
  font-family: inherit;
  color: #262626;
}

button {
  margin: 0;
  border: 0;
  min-height: 44px;
  border-radius: 519.48px;
  background: #f2f2f2;
  font-size: 14px;
}

input, textarea {
  box-sizing: border-box;
  border: 0.52px solid #e8e8e8;
  border-radius: 10.4px;
  background: #f7f7f7;
  color: #262626;
  font-size: 14px;
}

button::after { border: 0; }
button[plain] { border: 0.52px solid #e8e8e8; background: #fff; }
input { min-height: 44px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 11.44px 12.48px; line-height: 1.7; }

.pad { padding: 14.56px 12.48px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.4px;
  padding: 15.6px;
  border: 0;
  border-radius:16.64px;
  background: #fff;
}
.muted { color: #767676; font-size: 12px; }
.slot {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  margin-top: 6.24px;
  padding: 8.32px 10.4px;
  border-radius: 8.32px;
  background: #f5f5f5;
  font-size: 14px;
}
.slot-state { color: #767676; font-size: 12px; }
.teal { color: #e1251b; }
.title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  padding: 8.32px 0;
  border-bottom: 0.52px solid #eeeeee;
}
.row .k { flex: none; color: #767676; }
.soon { color: #c87825; }
.err { margin-top: 4.16px; color: #b42318; font-size: 12px; }
.note { margin-top: 4.16px; color: #e1251b; font-size: 12px; }
.empty { padding: 33.28px 16.64px; color: #767676; text-align: center; line-height: 1.8; }

.field { display: flex; align-items: center; gap: 8.32px; }
.field input {
  flex: 1;
  height: 44px;
  padding: 0 10.4px;
  border-radius: 10.4px;
  background: #fff;
}
.btn {
  display: block;
  margin: 0;
  padding: 0 14.56px;
  min-height: 44px;
  border-radius:519.48px;
  background: #e1251b;
  color: #fff;
  font-size: 14px;
  line-height: 44px;
  text-align: center;
}
button.ghost {
  margin: 8.32px 8.32px 0 0;
  padding: 0 12.48px;
  min-height: 44px;
  border-radius:519.48px;
  background: #f2f2f2;
  color: #262626;
  font-size: 12px;
  line-height: 44px;
}
button.ghost.on { background: #fff2f0; color: #e1251b; }
button[disabled], button.btn[disabled] { background: #f2f2f2; color: #767676; }
.chip {
  display: inline-block;
  margin-right: 4.16px;
  padding: 1.04px 5.2px;
  border-radius: 4.16px;
  background: #f2f2f2;
  color: #767676;
  font-size: 12px;
}
.login-go {
  display: block;
  min-height: 44px;
  margin-top: 8.32px;
  border-radius: 519.48px;
  background: #e1251b;
  color: #fff;
  font-weight: 600;
  line-height: 44px;
  text-align: center;
}
.foot {
  display: flex;
  justify-content: space-between;
  margin-top: 6.24px;
  color: #767676;
  font-size: 12px;
}

/* Shared form language also covers the compact secondary pages. */
.src { margin-top: 6.24px; color: #767676; font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius:519.48px; }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
@media (max-width: 350px) {
  .pad { padding-left: 12px; padding-right: 12px; }
  .card { padding: 14px; }
}

:host { display: block; }
.page-header { background: #f5f5f5; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 12.48px; box-sizing: border-box; }
.header-title { overflow: hidden; font-size: 24px; line-height: 1.25; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 12.48px 12.48px; color: #767676; font-size: 12px; line-height: 1.6; }
@media (max-width: 350px) { .header-title { font-size: 24px; } .header-subtitle { font-size: 12px; } }

.club-detail { min-height: 100vh; box-sizing: border-box; padding: 14.56px 12.48px calc(33.28px + env(safe-area-inset-bottom)); }
.club-detail .card { box-sizing: border-box; margin-bottom: 12.48px; padding: 16.64px; border: 0.52px solid #edf0f3; border-radius: 16.64px; }
.club-detail .detail-hero { padding: 19.76px 16.64px; background: linear-gradient(140deg, #fff 62%, #fff8f7); }
.club-detail .detail-hero .h2 { margin: 7.28px 0 10.4px; font-size: 22px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.club-detail .detail-kicker { color: #e1251b; font-size: 12px; font-weight: 600; letter-spacing: 1.04px; }
.club-detail .h2 { font-size: 16px; font-weight: 650; line-height: 1.4; }
.club-detail .src { color: #767676; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.club-detail .sum { margin-top: 14.56px; padding: 10.4px 12.48px; border-radius: 9.36px; background: #f7f7f7; color: #595959; font-size: 12px; line-height: 1.6; }
.club-detail button.btn, .club-detail button.ghost, .club-detail .fold-toggle { display: flex; align-items: center; justify-content: center; min-height:44px; height: auto; box-sizing: border-box; padding: 10.4px 12.48px; line-height: 1.35; font-size: 14px; text-align: center; }
.club-detail button.btn { margin-top: 12.48px; border-radius:519.48px; }
.club-detail button.ghost { margin: 8.32px 0 0; border: 0.52px solid #e8e8e8; border-radius:519.48px; background: #f7f7f7; color: #595959; font-size: 12px; }
.club-detail button.ghost.on { border-color: #ffb7c3; background: #fff2f0; color: #e1251b; }
.club-detail button[disabled] { color: #767676; background: #f2f2f2; }
.club-detail .fold-toggle { justify-content: space-between; width: 100%; min-height:44px; margin: 9.36px 0 0; padding: 8.32px 0; border-radius: 0; background: transparent; color: #767676; font-size: 12px; text-align: left; }
.club-detail .fold-toggle span:last-child { color: #767676; font-size: 18px; }
.club-detail .management-card > .fold-toggle { margin-top: 0; color: #595959; font-size: 14px; font-weight: 600; }
.club-detail .share-copy { max-height: 270.4px; margin-top: 6.24px; padding: 12.48px; overflow-y: auto; border-radius: 9.36px; background: #f7f7f7; color: #767676; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.club-detail .row { align-items: center; padding: 12.48px 0; font-size: 12px; }
.club-detail .row span { min-width: 0; overflow-wrap: anywhere; }
.club-detail .row span:last-child { flex-shrink: 0; max-width: 48%; text-align: right; font-variant-numeric: tabular-nums; }
.club-detail input { height: 45.76px; border: 0.52px solid #e8e8e8; background: #f7f7f7; font-size: 14px; }
.club-detail .detail-actions { display: flex; flex-wrap: wrap; gap: 8.32px; margin-top: 12.48px; }
.club-detail .detail-actions button.ghost { flex: 1; margin-top: 0; }

.club-detail .detail-options { display: flex; flex-wrap: wrap; gap: 6.24px; margin-top: 10.4px; }
.club-detail .detail-options button.ghost { flex: 1 1 42%; min-width: 0; margin: 0; }
.club-detail .detail-select { display: flex; align-items: center; justify-content: space-between; min-height:44px; margin-top: 10.4px; padding: 0 12.48px; border: 0.52px solid #e8e8e8; border-radius: 9.36px; background: #f7f7f7; color: #595959; font-size: 12px; }

.src { color: #767676; font-size: 12px; margin-top: 4.16px; }
.title { font-size: 18px; font-weight: 650; }
.album.grid { display: flex; flex-wrap: wrap; }
.album.grid .shot { width: 31%; margin: 8.32px 2% 0 0; }
.album.fall .shot { margin-top: 8.32px; }
.shot img, .shot video { width: 100%; border-radius: 8.32px; }
.album.grid .shot img, .album.grid .shot video { height: 104px; }
.album.fall .shot img, .album.fall .shot video { height: 187.2px; }
.drop { color: #e1251b; margin-right: 8.32px; }
.detail-state { margin: 16.64px; padding: 20.8px 14.56px; border-radius: 10.4px; background: #fff; text-align: center; }
.state-title { color: #262626; font-size: 14px; font-weight: 600; }
.detail-state .src { margin-top: 8.32px; overflow-wrap: anywhere; }
.detail-state .btn { margin-top: 14.56px; }

.club-detail .title { margin: 8.32px 0; font-size: 20px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.club-detail .drop { display: inline-flex; align-items: center; min-height:44px; font-size: 12px; }
.club-detail .shot .src { font-size: 12px; }
</style></head><body><div class="pad club-detail">
  <div class="card">

    </div>

  </div>
  
</div>

</body></html>
