<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {

.club-detail .src { color: #767676; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.club-detail .sum { margin-top: 11.946666666666667px; padding: 8.533333333333333px 10.24px; border-radius: 7.68px; background: #f7f7f7; color: #595959; font-size: 12px; line-height: 1.6; }
.club-detail button.btn, .club-detail button.ghost, .club-detail .fold-toggle { display: flex; align-items: center; justify-content: center; min-height:44px; height: auto; box-sizing: border-box; padding: 8.533333333333333px 10.24px; line-height: 1.35; font-size: 14px; text-align: center; }
.club-detail button.btn { margin-top: 10.24px; border-radius:426.24px; }
.club-detail button.ghost { margin: 6.826666666666667px 0 0; border: 0.4266666666666667px solid #e8e8e8; border-radius:426.24px; background: #f7f7f7; color: #595959; font-size: 12px; }
.club-detail button.ghost.on { border-color: #ffb7c3; background: #fff2f0; color: #e1251b; }
.club-detail button[disabled] { color: #767676; background: #f2f2f2; }
.club-detail .fold-toggle { justify-content: space-between; width: 100%; min-height:44px; margin: 7.68px 0 0; padding: 6.826666666666667px 0; border-radius: 0; background: transparent; color: #767676; font-size: 12px; text-align: left; }
.club-detail .fold-toggle span:last-child { color: #767676; font-size: 18px; }
.club-detail .management-card > .fold-toggle { margin-top: 0; color: #595959; font-size: 14px; font-weight: 600; }
.club-detail .share-copy { max-height: 221.86666666666667px; margin-top: 5.12px; padding: 10.24px; overflow-y: auto; border-radius: 7.68px; background: #f7f7f7; color: #767676; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.club-detail .row { align-items: center; padding: 10.24px 0; font-size: 12px; }
.club-detail .row span { min-width: 0; overflow-wrap: anywhere; }
.club-detail .row span:last-child { flex-shrink: 0; max-width: 48%; text-align: right; font-variant-numeric: tabular-nums; }
.club-detail input { height: 37.54666666666667px; border: 0.4266666666666667px solid #e8e8e8; background: #f7f7f7; font-size: 14px; }
.club-detail .detail-actions { display: flex; flex-wrap: wrap; gap: 6.826666666666667px; margin-top: 10.24px; }
.club-detail .detail-actions button.ghost { flex: 1; margin-top: 0; }

.club-detail .detail-options { display: flex; flex-wrap: wrap; gap: 5.12px; margin-top: 8.533333333333333px; }
.club-detail .detail-options button.ghost { flex: 1 1 42%; min-width: 0; margin: 0; }
.club-detail .detail-select { display: flex; align-items: center; justify-content: space-between; min-height:44px; margin-top: 8.533333333333333px; padding: 0 10.24px; border: 0.4266666666666667px solid #e8e8e8; border-radius: 7.68px; background: #f7f7f7; color: #595959; font-size: 12px; }

.src { color: #767676; font-size: 12px; margin-top: 3.4133333333333336px; white-space: pre-wrap; }
.sum { margin-top: 6.826666666666667px; font-weight: 650; }
.stack input { width: 100%; height: 34.13333333333333px; margin-top: 6.826666666666667px; background: #f5f5f5; border-radius: 6.826666666666667px; padding: 0 8.533333333333333px; box-sizing: border-box; }

.call-poster-canvas { position: fixed; left: -2000px; top: 0; width: 1px; height: 1px; pointer-events: none; }

</style></head><body><div class="pad club-detail">
