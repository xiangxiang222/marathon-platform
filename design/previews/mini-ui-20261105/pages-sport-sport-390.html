<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #767676;
  --border: #eeeeee;
  min-height: 100%;
  background: #f5f5f5;
  color: #262626;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

div, span, a, div, button, input, textarea, div {
  box-sizing: border-box;
}

button, input, textarea {
  font-family: inherit;
  color: #262626;
}

button {
  margin: 0;
  border: 0;
  min-height: 44px;
  border-radius: 519.48px;
  background: #f2f2f2;
  font-size: 14px;
}

input, textarea {
  box-sizing: border-box;
  border: 0.52px solid #e8e8e8;
  border-radius: 10.4px;
  background: #f7f7f7;
  color: #262626;
  font-size: 14px;
}

button::after { border: 0; }
button[plain] { border: 0.52px solid #e8e8e8; background: #fff; }
input { min-height: 44px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 11.44px 12.48px; line-height: 1.7; }

.pad { padding: 14.56px 12.48px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.4px;
  padding: 15.6px;
  border: 0;
  border-radius:16.64px;
  background: #fff;
}
.muted { color: #767676; font-size: 12px; }
.slot {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  margin-top: 6.24px;
  padding: 8.32px 10.4px;
  border-radius: 8.32px;
  background: #f5f5f5;
  font-size: 14px;
}
.slot-state { color: #767676; font-size: 12px; }
.teal { color: #e1251b; }
.title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  padding: 8.32px 0;
  border-bottom: 0.52px solid #eeeeee;
}
.row .k { flex: none; color: #767676; }
.soon { color: #c87825; }
.err { margin-top: 4.16px; color: #b42318; font-size: 12px; }
.note { margin-top: 4.16px; color: #e1251b; font-size: 12px; }
.empty { padding: 33.28px 16.64px; color: #767676; text-align: center; line-height: 1.8; }

.field { display: flex; align-items: center; gap: 8.32px; }
.field input {
  flex: 1;
  height: 44px;
  padding: 0 10.4px;
  border-radius: 10.4px;
  background: #fff;
}
.btn {
  display: block;
  margin: 0;
  padding: 0 14.56px;
  min-height: 44px;
  border-radius:519.48px;
  background: #e1251b;
  color: #fff;
  font-size: 14px;
  line-height: 44px;
  text-align: center;
}
button.ghost {
  margin: 8.32px 8.32px 0 0;
  padding: 0 12.48px;
  min-height: 44px;
  border-radius:519.48px;
  background: #f2f2f2;
  color: #262626;
  font-size: 12px;
  line-height: 44px;
}
button.ghost.on { background: #fff2f0; color: #e1251b; }
button[disabled], button.btn[disabled] { background: #f2f2f2; color: #767676; }
.chip {
  display: inline-block;
  margin-right: 4.16px;
  padding: 1.04px 5.2px;
  border-radius: 4.16px;
  background: #f2f2f2;
  color: #767676;
  font-size: 12px;
}
.login-go {
  display: block;
  min-height: 44px;
  margin-top: 8.32px;
  border-radius: 519.48px;
  background: #e1251b;
  color: #fff;
  font-weight: 600;
  line-height: 44px;
  text-align: center;
}
.foot {
  display: flex;
  justify-content: space-between;
  margin-top: 6.24px;
  color: #767676;
  font-size: 12px;
}

/* Shared form language also covers the compact secondary pages. */
.src { margin-top: 6.24px; color: #767676; font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius:519.48px; }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
@media (max-width: 350px) {
  .pad { padding-left: 12px; padding-right: 12px; }
  .card { padding: 14px; }
}

:host { display: block; }
.page-header { background: #f5f5f5; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 12.48px; box-sizing: border-box; }
.header-title { overflow: hidden; font-size: 24px; line-height: 1.25; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 12.48px 12.48px; color: #767676; font-size: 12px; line-height: 1.6; }
@media (max-width: 350px) { .header-title { font-size: 24px; } .header-subtitle { font-size: 12px; } }

.sport-page { padding: 0 12.48px calc(24.96px + env(safe-area-inset-bottom)); color: #262626; }.surface { padding: 16.64px; margin-bottom: 12.48px; border-radius:16.64px; background: #fff; }.hero-top,.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12.48px; }.field-label { color: #767676; font-size: 12px; }.month-value { margin-top: 5.2px; font-size: 14px; }.month-value span { color: #767676; }.text-button { display: flex; align-items: center; min-height: 44px; flex: none; padding: 6.24px 0; color: #e1251b; font-size: 12px; }.mileage-value { display: flex; align-items: baseline; gap: 8.32px; margin: 12.48px 0 14.56px; }.mileage-number { font-size: 56px; line-height: 1.15; letter-spacing: -1px; font-weight: 750;  color: #e1251b;}.mileage-unit { color: #767676; font-size: 14px; }.progress-track { height: 6.24px; border-radius: 4.16px; overflow: hidden; background: #f2f2f2; }.progress-value { height: 100%; border-radius: inherit; background: #e1251b; }.target-caption { display: flex; justify-content: space-between; gap: 8.32px; margin-top: 8.32px; color: #767676; font-size: 12px; }.accent { color: #e1251b; }.no-target { color: #767676; font-size: 12px; line-height: 20.8px; }.run-metrics { display: flex; padding-top: 14.56px; margin-top: 14.56px; border-top: 0.52px solid #eeeeee; }.run-metrics > div { flex: 1; min-width: 0; text-align: center; }.run-metrics > div:first-child { text-align: left; }.run-metrics > div:last-child { text-align: right; }.metric-value { display: block; font-size: 22px; line-height: 29.12px; font-weight: 650; }.metric-label { display: block; margin-top: 4.16px; color: #767676; font-size: 12px; }.primary { display: block; width: 100%; min-height:44px; margin: 0; padding: 0 12.48px; border-radius:519.48px; background: #e1251b; color: #fff; font-size: 14px; font-weight: 600; line-height: 45.76px; }.primary::after,.secondary::after,.delete-button::after,.choices button::after { border: 0; }.manual-note { margin: 8.32px 0 20.8px; text-align: center; color: #767676; font-size: 12px; line-height: 18.72px; }.section-title { font-size: 16px; line-height: 24.96px; font-weight: 600; }.records-heading { margin: 20.8px 4.16px 12.48px; }.records-title { font-size: 18px; line-height: 27.04px; font-weight: 600; }.run-date { margin: 6.24px 0 14.56px; color: #767676; font-size: 12px; line-height: 18.72px; }.record-data { display: flex; gap: 7.28px;  padding: 12.48px 0;}.record-data > div { flex: 1; min-width: 0; }.record-number { display: block; font-size: 18px; line-height: 1.4; font-weight: 600; }.record-unit { display: block; margin-top: 3.12px; color: #767676; font-size: 12px; }.hint { margin-top: 10.4px; color: #767676; font-size: 12px; line-height: 19.76px; }.stack { display: flex; flex-direction: column; gap: 12.48px; margin-top: 14.56px; }.stack input { width: 100%; min-width: 0; height: 45.76px; padding: 0 12.48px; border: 0; border-radius: 8.32px; background: #f5f5f5; color: #262626; font-size: 14px; box-sizing: border-box; }.stack > .field-label + input { margin-top: -6.24px; }.field-pair { display: flex; gap: 10.4px; }.field-pair > div { flex: 1; min-width: 0; }.field-pair input,.picker-value { margin-top: 6.24px; }.picker-value { height: 45.76px; padding: 0 12.48px; border-radius: 8.32px; background: #f5f5f5; font-size: 14px; line-height: 45.76px; }.choices { display: flex; gap: 8.32px; }.choices button { flex: none; min-width: 64.48px; min-height:44px; margin: 0; padding: 0 12.48px; border-radius:519.48px; background: #f2f2f2; color: #262626; font-size: 14px; line-height: 37.44px; }.choices button.on { color: #e1251b; background: #fff2f0; }.close-button { display: flex; align-items: center; min-height: 44px; padding: 6.24px 0; color: #767676; font-size: 12px; }.secondary { width: 100%; min-height:44px; margin: 0; padding: 0 12.48px; border-radius:519.48px; background: #f2f2f2; color: #262626; font-size: 12px; line-height: 45.76px; }.record-editor { margin-top: 16.64px; padding-top: 12.48px; border-top: 0.52px solid #eeeeee; }.delete-button { min-height:44px; margin: 0; color: #767676; background: transparent; font-size: 12px; line-height: 41.6px; }.shot { display: block; width: 100%; margin-top: 12.48px; border-radius: 8.32px; }.guest-state,.empty-state { padding: 29.12px 20.8px; text-align: center; }.guest-title { margin-top: 12.48px; font-size: 20px; line-height: 29.12px; font-weight: 600; }.guest-state .hint { margin: 8.32px 0 20.8px; }.guest-mark { display: flex; align-items: center; justify-content: center; width: 58.24px; height: 58.24px; margin: auto; border-radius: 50%; background: #fff2f0; color: #e1251b; font-size: 31.2px; }.year-note,.loading-copy { margin: 16.64px 4.16px; color: #767676; font-size: 12px; line-height: 20.8px; }.message { margin: 12.48px 4.16px; color: #e1251b; font-size: 12px; line-height: 20.8px; }
