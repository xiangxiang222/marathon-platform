<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {
  --brand: #e1251b;
  --brand-soft: #fff2f0;
  --page-bg: #f5f5f5;
  --surface: #ffffff;
  --text: #262626;
  --text-secondary: #767676;
  --border: #eeeeee;
  min-height: 100%;
  background: #f5f5f5;
  color: #262626;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

div, span, a, div, button, input, textarea, div {
  box-sizing: border-box;
}

button, input, textarea {
  font-family: inherit;
  color: #262626;
}

button {
  margin: 0;
  border: 0;
  min-height: 44px;
  border-radius: 519.48px;
  background: #f2f2f2;
  font-size: 14px;
}

input, textarea {
  box-sizing: border-box;
  border: 0.52px solid #e8e8e8;
  border-radius: 10.4px;
  background: #f7f7f7;
  color: #262626;
  font-size: 14px;
}

button::after { border: 0; }
button[plain] { border: 0.52px solid #e8e8e8; background: #fff; }
input { min-height: 44px; padding: 0 12.48px; }
textarea { min-height: 120px; padding: 11.44px 12.48px; line-height: 1.7; }

.pad { padding: 14.56px 12.48px calc(24.96px + env(safe-area-inset-bottom)); }
.card {
  margin-bottom: 10.4px;
  padding: 15.6px;
  border: 0;
  border-radius:16.64px;
  background: #fff;
}
.muted { color: #767676; font-size: 12px; }
.slot {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  margin-top: 6.24px;
  padding: 8.32px 10.4px;
  border-radius: 8.32px;
  background: #f5f5f5;
  font-size: 14px;
}
.slot-state { color: #767676; font-size: 12px; }
.teal { color: #e1251b; }
.title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12.48px;
  padding: 8.32px 0;
  border-bottom: 0.52px solid #eeeeee;
}
.row .k { flex: none; color: #767676; }
.soon { color: #c87825; }
.err { margin-top: 4.16px; color: #b42318; font-size: 12px; }
.note { margin-top: 4.16px; color: #e1251b; font-size: 12px; }
.empty { padding: 33.28px 16.64px; color: #767676; text-align: center; line-height: 1.8; }

.field { display: flex; align-items: center; gap: 8.32px; }
.field input {
  flex: 1;
  height: 44px;
  padding: 0 10.4px;
  border-radius: 10.4px;
  background: #fff;
}
.btn {
  display: block;
  margin: 0;
  padding: 0 14.56px;
  min-height: 44px;
  border-radius:519.48px;
  background: #e1251b;
  color: #fff;
  font-size: 14px;
  line-height: 44px;
  text-align: center;
}
button.ghost {
  margin: 8.32px 8.32px 0 0;
  padding: 0 12.48px;
  min-height: 44px;
  border-radius:519.48px;
  background: #f2f2f2;
  color: #262626;
  font-size: 12px;
  line-height: 44px;
}
button.ghost.on { background: #fff2f0; color: #e1251b; }
button[disabled], button.btn[disabled] { background: #f2f2f2; color: #767676; }
.chip {
  display: inline-block;
  margin-right: 4.16px;
  padding: 1.04px 5.2px;
  border-radius: 4.16px;
  background: #f2f2f2;
  color: #767676;
  font-size: 12px;
}
.login-go {
  display: block;
  min-height: 44px;
  margin-top: 8.32px;
  border-radius: 519.48px;
  background: #e1251b;
  color: #fff;
  font-weight: 600;
  line-height: 44px;
  text-align: center;
}
.foot {
  display: flex;
  justify-content: space-between;
  margin-top: 6.24px;
  color: #767676;
  font-size: 12px;
}

/* Shared form language also covers the compact secondary pages. */
.src { margin-top: 6.24px; color: #767676; font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius:519.48px; }
.field-label, .form-label { line-height: 1.6; }
.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
@media (max-width: 350px) {
  .pad { padding-left: 12px; padding-right: 12px; }
  .card { padding: 14px; }
}

:host { display: block; }
.page-header { background: #f5f5f5; color: #262626; }
.header-main { display: flex; align-items: center; padding-left: 12.48px; box-sizing: border-box; }
.header-title { overflow: hidden; font-size: 24px; line-height: 1.25; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.header-subtitle { padding: 0 12.48px 12.48px; color: #767676; font-size: 12px; line-height: 1.6; }
@media (max-width: 350px) { .header-title { font-size: 24px; } .header-subtitle { font-size: 12px; } }

.page { min-height: 100vh; box-sizing: border-box; padding: 15.6px 14.56px 93.6px; color: #262626; background: #f5f5f5; }
.loading, .error-panel { padding: 52px 14.56px; color: #767676; text-align: center; font-size: 14px; }
.retry { display: block; width: 114.4px; margin: 14.56px auto 0; color: #e1251b; background: #fff; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 8.32px; min-height: 19.76px; }
.eyebrow, .section-kicker { color: #767676; font-size: 12px; font-weight: 600; }
.copy-tag { padding: 3.12px 6.24px; color: #e1251b; background: #fff2f0; border-radius: 10.4px; font-size: 12px; }
.heading { margin: 4.16px 0 11.44px; font-size: 22px; line-height: 1.2; font-weight: 700; }
.steps { display: flex; align-items: center; gap: 5.2px; margin: 0 0 14.56px; }
.step { display: flex; flex: none; align-items: center; gap: 4.16px; color: #767676; font-size: 12px; }
.step span:first-child { display: flex; align-items: center; justify-content: center; width: 20.8px; height: 20.8px; color: #767676; background: #e8eaf0; border-radius: 50%; font-size: 12px; }
.step.current { color: #262626; font-weight: 600; }
.step.current span:first-child, .step.done span:first-child { color: #fff; background: #e1251b; }
.step-line { flex: 1; min-width: 4.16px; height: 1.04px; background: #dfe1e7; }
.restore-line { display: flex; align-items: center; gap: 6.24px; margin-bottom: 10.4px; padding: 8.32px; background: #fff; border-left: 2.6px solid #e1251b; }
.restore-line > div:first-child { flex: 1; min-width: 0; }
.restore-title { font-size: 12px; font-weight: 600; }
.restore-btn, .discard-btn { flex: none; padding: 0 7.28px; min-height: 44px; font-size: 12px; border-radius: 4.16px; }
.restore-btn { color: #fff; background: #e1251b; }
.discard-btn { color: #767676; background: #f5f5f5; }
.subtle { color: #767676; font-size: 12px; line-height: 1.45; }
.form-area, .preview { padding: 16.64px 13.52px; background: #fff; border-radius: 16.64px; }
.section-kicker { color: #e1251b; letter-spacing: 0.52px; }
.section-title { margin: 3.12px 0 10.4px; font-size: 18px; font-weight: 650; }
.small-title { margin-bottom: 5.2px; font-size: 14px; }
.spaced { margin-top: 18.72px; }
.type-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5.2px; margin-bottom: 11.44px; }
.type-option { display: flex; align-items: center; justify-content: space-between; gap: 4.16px; min-height:44px; box-sizing: border-box; padding: 0 7.28px; border: 0.52px solid #e8e8e8; border-radius: 10.4px; color: #595959; font-size: 12px; }
.type-selected { border-color: #e1251b; color: #e1251b; background: #fff8f7; }
.type-tag { color: #767676; font-size: 12px; }
.label { margin: 13.52px 0 6.24px; color: #595959; font-size: 14px; font-weight: 600; }
.required { margin-left: 4.16px; color: #e1251b; font-size: 12px; font-weight: 400; }
.optional { margin-left: 4.16px; color: #767676; font-size: 12px; font-weight: 400; }
.field, .picker-field, .textarea { display: block; width: 100%; min-width: 0; box-sizing: border-box; border: 0.52px solid #e9ebf0; border-radius: 10.4px; background: #f7f7f7; color: #262626; font-size: 14px; }
.field { min-height: 44px; height: 44px; padding: 0 8.32px; }
.picker-field { min-height: 44px; height: 44px; padding: 0 8.32px; line-height: 44px; }
.placeholder { color: #767676; }
.two-col { display: flex; gap: 7.28px; margin-top: 4.16px; }
.col { flex: 1; min-width: 0; }
.two-col .label { margin-top: 8.32px; }
.time-clear { position: relative; }
.time-clear div { display: block; }
.time-clear .picker-field { padding-right: 32.24px; }
.clear { position: absolute; top: 0; right: 5.2px; min-height: 44px; height: 44px; color: #e1251b; font-size: 12px; line-height: 44px; }
.group-line { display: grid; grid-template-columns: 28px minmax(0, 1fr) 64px; align-items: center; gap: 5.2px; margin: 5.2px 0; padding: 6.24px 5.2px; border: 0.52px solid #e8e8e8; border-radius: 10.4px; }
.group-switch { grid-column: 1; grid-row: 1 / 3; transform: scale(.8); transform-origin: center; }
.group-fields { grid-column: 2; grid-row: 1 / 3; flex: 1; min-width: 0; }
.group-fields .field { margin: 0 0 4.16px; height: 44px; font-size: 14px; }
.group-fields .field:last-child { margin-bottom: 0; }
.capacity { grid-column: 3; grid-row: 1; flex: none; width: 100%; text-align: center; }
.capacity .field { height: 44px; padding: 0 3.12px; text-align: center; }
.capacity .subtle { display: block; font-size: 12px; }
.group-line > div { grid-column: 3; grid-row: 2; }
.kind-picker { display: flex; align-items: center; justify-content: center; min-height: 44px; flex: none; max-width: 100%; padding: 6.24px 4.16px; border-radius: 10.4px; color: #595959; background: #f5f5f5; font-size: 12px; text-align: center; }
.group-muted { opacity: .52; }
.empty-groups { padding: 9.36px 0; color: #767676; font-size: 12px; }
.add-group { width: 100%; height: 35.36px; margin-top: 6.24px; border: 0.52px dashed #d8dbe2; border-radius: 10.4px; color: #e1251b; background: #fff; font-size: 12px; }
.metrics { margin-bottom: 8.32px; }
.textarea { height: 114.4px; padding: 7.28px; line-height: 1.55; }
.textarea.short { height: 72.8px; }
.review-row { display: flex; align-items: center; justify-content: space-between; gap: 10.4px; margin-top: 12.48px; padding-top: 9.36px; border-top: 0.52px solid #eeeeee; }
.review-row .label { margin: 0 0 2.08px; }
.preview-hero { position: relative; overflow: hidden; padding: 11.44px 17.68px 11.44px 11.44px; color: #262626; background: #fff2f0; border-radius: 10.4px; }
.preview-hero::before { position: absolute; top: 0; right: 0; width: 6.24px; height: 100%; background: #e1251b; content: ""; }
.preview-type { font-size: 12px; opacity: .85; }
.preview-title { margin-top: 8.32px; font-size: 18px; line-height: 1.35; font-weight: 700; overflow-wrap: anywhere; }
.distance { margin-top: 4.16px; color: #e1251b; font-size: 37.44px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.distance span { font-size: 12px; }
.preview-date, .preview-place { margin-top: 6.24px; font-size: 12px; }
.preview-section { margin-top: 12.48px; }
.preview-label { margin-bottom: 5.2px; color: #767676; font-size: 12px; font-weight: 600; }
.preview-copy { white-space: pre-line; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.preview-group { display: flex; justify-content: space-between; gap: 5.2px; padding: 7.28px 0; border-bottom: 0.52px solid #eeeeee; font-size: 12px; }
.preview-group span:first-child { font-weight: 600; }
.preview-group span:last-child { color: #767676; }
.preview-foot { margin-top: 13.52px; padding-top: 9.36px; border-top: 0.52px solid #eeeeee; color: #767676; font-size: 12px; }
.message { margin: 8.32px 0; padding: 7.28px; color: #bf243d; background: #fff2f0; border-radius: 10.4px; font-size: 12px; overflow-wrap: anywhere; }
.bottom-actions { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; gap: 6.24px; padding: 8.32px 13.52px calc(8.32px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.98); border-top: 0.52px solid #e9ebf0; }
.bottom-actions button { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 44px; height: 44px; line-height: 1.4; border-radius: 519.48px; font-size: 14px; }
.save-action { flex: 1; color: #595959; background: #eeeeee; }
.back-action { flex: 1; color: #595959; background: #eeeeee; }
.next-action { flex: 2; color: #fff; background: #e1251b; font-weight: 600; }
.next-action span { margin-left: 3.12px; font-size: 16px; }
@media (max-width: 350px) {
  .page { padding-right: 9.36px; padding-left: 9.36px; }
  .form-area, .preview { padding-right: 7.28px; padding-left: 7.28px; }
  .step { gap: 2.6px; font-size: 12px; }
  .step span:first-child { width: 17.68px; height: 17.68px; }
  .group-line { gap: 2.6px; }
  .capacity { width: 100%; }
  .kind-picker { max-width: 100%; font-size: 12px; }
}
</style></head><body><div class="page">
  
  
  
    
    
    <div class="topline"><span class="eyebrow">杭州一起跑俱乐部</span></div>
    <div class="heading">发布活动</div><div class="subtle">以下活动时间均为北京时间</div>
    <div class="steps"><div class="step current"><span>01</span><span>时间与地点</span></div><div class="step-line"></div><div class="step "><span>02</span><span>分组与安排</span></div><div class="step-line"></div><div class="step "><span>03</span><span>确认发布</span></div></div>

    

    <div class="form-area">
      <div class="section-kicker">01 / 活动信息</div><div class="section-title">先定下这一场</div>
      <div class="type-row"><div class="type-option "><span>轻松跑</span><span class="type-tag">轻松有氧</span></div><div class="type-option "><span>长距离</span><span class="type-tag">耐力积累</span></div><div class="type-option "><span>间歇训练</span><span class="type-tag">速度提升</span></div><div class="type-option type-selected"><span>自由安排</span><span class="type-tag">按需安排</span></div></div>
      <div class="label">活动名称 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="填写训练标题" style="">
      <div class="two-col"><div class="col"><div class="label">活动日期 <span class="required">必填</span></div><div mode="date" value=""><div class="picker-field placeholder">选择日期</div></div></div><div class="col"><div class="label">开始时间 <span class="required">必填</span></div><div mode="time" value=""><div class="picker-field placeholder">选择时间</div></div></div></div>
      <div class="two-col"><div class="col"><div class="label">结束日期 <span class="optional">可选</span></div><div mode="date" value=""><div class="picker-field">选择日期</div></div></div><div class="col"><div class="label">结束时间 <span class="optional">可选</span></div><div class="time-clear"><div mode="time" value=""><div class="picker-field">选择时间</div></div></div></div></div>
      <div class="label">地点 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="公园、跑道或区域" aria-label="公园、跑道或区域" style="">
      <div class="label">具体集合点 <span class="required">必填</span></div><input class="field" maxlength="40" placeholder="例如：东门地铁口 A 出口" aria-label="例如：东门地铁口 A 出口" style="">
      <div class="label">集合时间 <span class="optional">可选</span></div><div mode="time" value=""><div class="picker-field">和活动开始时间一致</div></div>
      <div class="two-col"><div class="col"><div class="label">计划里程 <span class="optional">公里</span></div><input class="field" type="digit" placeholder="例如 10" aria-label="例如 10" style=""></div><div class="col"><div class="label">期次 <span class="optional">可选</span></div><input class="field" maxlength="40" placeholder="例如第 12 期" aria-label="例如第 12 期" style=""></div></div>
      <div class="label">路线说明 <span class="optional">可选</span></div><input class="field" maxlength="200" placeholder="路线、补水点或交通提示" aria-label="路线、补水点或交通提示" style="">
      <div class="section-kicker spaced">报名设置</div><div class="section-title small-title">报名时间</div>
      <div class="two-col"><div class="col"><div class="label">报名截止日期</div><div mode="date" value=""><div class="picker-field">活动开始前</div></div></div><div class="col"><div class="label">截止时间</div><div class="time-clear"><div mode="time" value=""><div class="picker-field">不单独设置</div></div></div></div></div>
      <div class="two-col"><div class="col"><div class="label">取消截止日期</div><div mode="date" value=""><div class="picker-field">开始时间前</div></div></div><div class="col"><div class="label">取消截止时间</div><div class="time-clear"><div mode="time" value=""><div class="picker-field">不单独设置</div></div></div></div></div>
    </div>

      

    

    
    <div class="bottom-actions"><button class="save-action">保存草稿</button><button class="next-action">继续 <span>›</span></button></div>
    
  
</div>
</body></html>
