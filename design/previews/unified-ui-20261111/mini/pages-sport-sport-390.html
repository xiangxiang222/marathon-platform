<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}body{padding-bottom:70px}a{display:block;color:inherit;text-decoration:none}button{display:block;box-sizing:border-box;padding:0 14px;line-height:1.35}input,textarea{outline:none}input[type=checkbox]{min-height:0}img{display:inline-block;vertical-align:middle}*{box-sizing:border-box}.native-switch{display:inline-block;width:44px;height:26px;flex:none;border-radius:20px;background:#dedede;position:relative}.native-switch[checked=true]{background:#e1251b}.native-switch:after{content:"";display:block;position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white}.native-switch[checked=true]:after{left:20px}swiper-item{display:block}.audit-banner{font:10px system-ui;color:#767676;padding:5px 12px;text-align:center}.mirror-tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:white;border-top:1px solid #eee;height:64px;padding:6px 0}.mirror-tabbar a{width:25%;font:11px system-ui;text-align:center}.mirror-tabbar img{display:block;margin:0 auto 3px;width:25px;height:25px}</style><style>body {

}

}

  background: var(--page-bg);

.chip { display: inline-block; margin-right: 4.16px; padding: 2.08px 6.24px; border: 0.52px solid #ebebed; border-radius: 6.24px; background: #f5f5f7; color: var(--text-secondary); font-size: 11px; font-weight: 400; line-height: 1.6; }
.foot { display: flex; justify-content: space-between; gap: 10.4px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }
.src { margin-top: 6.24px; color: var(--text-secondary); font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
.card > input, .card > textarea, .card > div { margin-top: 10.4px; }
.card > input { width: 100%; }
.card > .btn { margin-top: 12.48px; }
.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }

.metric-value, .stat-value, .career-number, .record-number, .rank-time { font-variant-numeric: tabular-nums; }
/* Shared control roles for new screens and gradual migrations. */
.ui-control-text { width: auto; min-height: 44px; padding: 10px 8px; border: 0; border-radius: 6.24px; background: transparent; color: var(--brand); font-size: 13px; }
.ui-control-danger { border-color: #f5d1cc; background: #fff5f3; color: #c52e24; }
.ui-label { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
.surface-sky, .surface-mint, .surface-lilac, .surface-sun, .surface-peach { background: var(--surface); border-color: var(--border); }
@media (max-width: 350px) { .pad { padding-left: 14px; padding-right: 14px; } .card { padding: 16px; } }

:host { display: block; }
.page-header { background: #fff; color: var(--text, #17212b); }
.header-main { display: flex; align-items: center; padding-left: 16.64px; box-sizing: border-box; }

.header-subtitle { padding: 0 16.64px 12.48px; color: var(--text-secondary, #687480); font-size: 13px; line-height: 1.7; }
@media (max-width: 350px) { .header-main { padding-left: 14px; } .header-subtitle { padding-left: 14px; padding-right: 14px; } }

.header-actions { display: flex; flex: none; align-items: center; justify-content: flex-end; }

.sport-page { padding: 14.56px 16.64px calc(24.96px + env(safe-area-inset-bottom)); background: transparent; }.surface { padding: 16.64px; margin-bottom: 12.48px;  background: #ffffff; box-shadow: var(--card-shadow); }.hero-top,.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12.48px; }.field-label { color: var(--text-secondary); font-size: 12px; }.month-value { margin-top: 5.2px; font-size: 14px; }.month-value span { color: var(--text-secondary); }.text-button { display: flex; align-items: center; min-height: 44px; flex: none; padding: 6.24px 0; color: var(--brand); font-size: 12px; }.mileage-value { display: flex; align-items: baseline; gap: 8.32px; margin: 12.48px 0 14.56px; }.mileage-number { font-size: 48px; line-height: 1.15; letter-spacing: -1px; font-weight: 750;  color: var(--text);}.mileage-unit { color: var(--text-secondary); font-size: 14px; }.progress-track { height: 6.24px; border-radius: 4.16px; overflow: hidden; background: var(--border); }.progress-value { height: 100%; border-radius: inherit; background: var(--surface); }.target-caption { display: flex; justify-content: space-between; gap: 8.32px; margin-top: 8.32px; color: var(--text-secondary); font-size: 12px; }.accent { color: var(--brand); }.no-target { color: var(--text-secondary); font-size: 12px; line-height: 20.8px; }.run-metrics { display: flex; padding-top: 14.56px; margin-top: 14.56px; border-top: 0.52px solid var(--border); background: rgba(255,255,255,.55); }.run-metrics > div { flex: 1; min-width: 0; text-align: center; }.run-metrics > div:first-child { text-align: left; }.run-metrics > div:last-child { text-align: right; }.metric-value { display: block; font-size: 22px; line-height: 29.12px; font-weight: 650; }.metric-label { display: block; margin-top: 4.16px; color: var(--text-secondary); font-size: 12px; }.primary { display: block; width: 100%; min-height:44px; margin: 0; padding: 0 12.48px;  background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; line-height: 45.76px; }.primary::after,.secondary::after,.delete-button::after,.choices button::after { border: 0;  }.manual-note { margin: 8.32px 0 20.8px; text-align: center; color: var(--text-secondary); font-size: 12px; line-height: 18.72px; }.section-title { font-size: 19px; line-height: 24.96px; font-weight: 600; }.records-heading { margin: 20.8px 4.16px 12.48px; }.records-title { font-size: 20px; line-height: 27.04px; font-weight: 600; }.run-date { margin: 6.24px 0 14.56px; color: var(--text-secondary); font-size: 12px; line-height: 18.72px; }.record-data { display: flex; gap: 7.28px;  padding: 12.48px 0;}.record-data > div { flex: 1; min-width: 0; }.record-number { display: block; font-size: 18px; line-height: 1.4; font-weight: 600; }.record-unit { display: block; margin-top: 3.12px; color: var(--text-secondary); font-size: 12px; }.hint { margin-top: 10.4px; color: var(--text-secondary); font-size: 12px; line-height: 19.76px; }.stack { display: flex; flex-direction: column; gap: 12.48px; margin-top: 14.56px; }.stack input { width: 100%; min-width: 0; height: 45.76px; padding: 0 12.48px; border: 0; border-radius: 8.32px; background: var(--page-bg); color: var(--text); font-size: 14px; box-sizing: border-box; }.stack > .field-label + input { margin-top: -6.24px; }.field-pair { display: flex; gap: 10.4px; }.field-pair > div { flex: 1; min-width: 0; }.field-pair input,.picker-value { margin-top: 6.24px;  }.picker-value { height: 45.76px; padding: 0 12.48px;  background: var(--page-bg); font-size: 14px; line-height: 45.76px; }.choices { display: flex;  }.choices button { flex: none; min-width: 64.48px; margin: 0; line-height: 37.44px; }.close-button { display: flex; align-items: center; min-height: 44px; padding: 6.24px 0; color: var(--text-secondary); font-size: 12px; }.secondary { width: 100%; min-height:44px; margin: 0; padding: 0 12.48px; color: var(--text); font-size: 12px; line-height: 45.76px; }.record-editor { margin-top: 16.64px; padding-top: 12.48px; border-top: 0.52px solid var(--border); }.delete-button { min-height:44px; margin: 0; color: var(--text-secondary); background: transparent; font-size: 12px; line-height: 41.6px; }.shot { display: block; width: 100%; margin-top: 12.48px; border-radius: 8.32px; }.guest-state { padding: 29.12px 20.8px; text-align: center; background: var(--surface); }
.empty-state { padding: 29.12px 20.8px; text-align: center; }.guest-title { margin-top: 12.48px; font-size: 24px; line-height: 29.12px; font-weight: 600; }.guest-state .hint { margin: 8.32px 0 20.8px; }.guest-mark { display: flex; align-items: center; justify-content: center; width: 58.24px; height: 58.24px; margin: auto; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 31.2px; }.year-note,.loading-copy { margin: 16.64px 4.16px; color: var(--text-secondary); font-size: 12px; line-height: 20.8px; }.message { margin: 12.48px 4.16px; color: var(--brand); font-size: 12px; line-height: 20.8px; }

/* Route geometry: surfaces, controls and compact labels have distinct roles. */
.mini-sport-sport .surface { border-radius: var(--card-radius); }
.mini-sport-sport .primary, .mini-sport-sport .secondary, .mini-sport-sport .import-button, .mini-sport-sport .picker-value { border-radius: var(--control-radius); }
.mini-sport-sport .choices { border-radius: 7.28px; }

/* Page composition and interaction hierarchy. */
.mini-sport-sport { color: var(--text); }
.mini-sport-sport button { font-weight: 500; border-radius: var(--control-radius); }

.sport-page { color: var(--text); background: transparent; }
.surface { border: 1px solid var(--border); box-shadow: var(--card-shadow); background: #ffffff; }
.section-title,.records-title { font-weight: 600; }
.stack input,.picker-value { border: 1px solid var(--border); border-radius: var(--control-radius); background: var(--page-bg); font-size: 14px; }

.choices button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.secondary { border: 1px solid var(--border); background: #fff; }

.mini-sport-sport .secondary, .mini-sport-sport .import-button { font-size: 13px; font-weight: 500; }

.mileage-hero { background: var(--surface); border-color: var(--border); box-shadow: var(--card-shadow); }
.editor { background: #ffffff; }

.progress-value { background: var(--brand); }
.mileage-hero { background: var(--surface); border-color: var(--border); }
