  --lilac: #45515d;
  --lilac-soft: #f2f4f6;
  --sun: #45515d;
  --sun-soft: #f2f4f6;
  --peach-soft: #fff2f0;
  --card-shadow: none;
  --action-fill: #e1251b;
  --control-radius: 10.4px;
  --card-radius: 16.64px;
  min-height: 100%;
  background: var(--page-bg);

  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;

}
div, span, a, div, button, input, textarea, div { box-sizing: border-box; }

button {

  justify-content: center;

  min-height: 44px;
  margin: 0;
  padding: 12px 18px;

  line-height: 1.4;
}

input, textarea {
  min-width: 0;

  background: var(--page-bg);

}

}

.btn, .login-go {

.primary, .primary-btn, .primary-button, .submit-button, .save-action, .next-action, .bottom-primary, .staff-primary { border-radius: var(--control-radius); }
.field-label, .form-label { line-height: 1.6; }

/* Shared control roles for new screens and gradual migrations. */

.quick-entries { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 4.16px 16.64px 0; padding: 14.56px 0 10.4px;  background: #ffffff; border-color: var(--border); box-shadow: var(--card-shadow); }

.filter-chip:first-child { margin-left: 12.48px;  }
